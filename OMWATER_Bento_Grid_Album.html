<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>OMWATER V5 - Bento Grid</title>
    <style>
        body { margin: 0; background: #f5f5f7; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 0; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 46px; margin: 0; color: #1d1d1f; letter-spacing: -1px; }
        
        .bento { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            grid-auto-rows: 240px; 
            gap: 24px; 
            width: 90vw; 
            max-width: 1200px; 
            perspective: 1200px; 
        }
        
        .card { 
            position: relative; 
            background: #fff;
            border-radius: 28px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: transform 0.1s; 
            transform-style: preserve-3d; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); 
            border: 1px solid rgba(0,0,0,0.04);
        }
        
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card .content { position: absolute; bottom: 20px; left: 20px; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; pointer-events: none;}
        
        /* Grid Spans for Bento look */
        .card.large { grid-column: span 2; grid-row: span 2; }
        .card.wide { grid-column: span 2; }
        .card.tall { grid-row: span 2; }
        
        /* Glare Effect (Ánh sáng lóa kính) */
        .glare { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.6), transparent 50%); 
            opacity: 0; pointer-events: none; transition: opacity 0.4s; 
        }
        .card:hover .glare { opacity: 1; }
    </style>
</head>
<body>
    <div class="header"><h1>Bento Grid 3D Tilt</h1></div>
    <div class="bento">
        <div class="card large"><img src="album/IMG_4121.JPG"><div class="content">Hệ thống Lõi</div><div class="glare"></div></div>
        <div class="card wide"><img src="album/IMG_4125.JPG"><div class="content">Đường ống</div><div class="glare"></div></div>
        <div class="card"><img src="album/IMG_4140.JPG"><div class="content">UV</div><div class="glare"></div></div>
        <div class="card tall"><img src="album/IMG_4170.JPG"><div class="content">Trạm bơm</div><div class="glare"></div></div>
        <div class="card wide"><img src="album/IMG_4197.JPG"><div class="content">Nghiệm thu</div><div class="glare"></div></div>
        <div class="card"><img src="album/IMG_4198.JPG"><div class="content">RO</div><div class="glare"></div></div>
    </div>
    <script>
        document.querySelectorAll('.card').forEach(card => {
            const glare = card.querySelector('.glare');
            
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Tính góc nghiêng dựa trên tọa độ chuột
                const rotateX = ((y / rect.height) - 0.5) * -12; // Nghiêng trục X
                const rotateY = ((x / rect.width) - 0.5) * 12;   // Nghiêng trục Y
                
                // Tilt card & phóng to nhẹ
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
                card.style.zIndex = 10;
                card.style.boxShadow = `0 20px 50px rgba(0,0,0,0.15)`;
                
                // Di chuyển đốm sáng Glare theo chuột
                glare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.5), transparent 60%)`;
            });
            
            card.addEventListener('mouseleave', () => {
                // Hồi phục vị trí ban đầu
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                card.style.zIndex = 1;
                card.style.boxShadow = `0 10px 30px rgba(0,0,0,0.06)`;
                card.style.transition = `all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)`;
                
                // Gỡ transition sau khi hồi phục để lần di chuột sau không bị trễ
                setTimeout(() => card.style.transition = `transform 0.1s`, 500);
            });
        });
    </script>
</body>
</html>
