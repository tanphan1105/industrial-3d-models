<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>OMWATER V5 - Floating Glass</title>
    <style>
        body { 
            margin: 0; 
            /* Gradient vũ trụ bồng bềnh */
            background: linear-gradient(135deg, #0b1a2e 0%, #1a3a5e 50%, #295074 100%); 
            overflow: hidden; 
            font-family: -apple-system, sans-serif; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            height: 100vh; 
            perspective: 1000px; 
            color: #fff;
        }
        .header { position: absolute; top: 40px; text-align: center; }
        .header h1 { font-size: 46px; margin: 0; letter-spacing: -1px; }

        .scene { 
            width: 100%; height: 100%; 
            display: flex; justify-content: center; align-items: center; 
            transform-style: preserve-3d; 
            /* Trì hoãn xoay cảnh để mượt mà (Parallax delay) */
            transition: transform 0.2s ease-out; 
        }
        
        .glass-card { 
            position: absolute; 
            width: 320px; height: 450px; 
            /* Hiệu ứng Kính Mờ (Glassmorphism) */
            background: rgba(255,255,255,0.05); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.2); 
            border-top: 1px solid rgba(255,255,255,0.4);
            border-left: 1px solid rgba(255,255,255,0.4);
            border-radius: 30px; 
            padding: 15px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.4); 
            /* Hoạt ảnh lơ lửng */
            animation: float 6s ease-in-out infinite alternate; 
            display: flex; flex-direction: column; 
        }
        
        .glass-card img { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }
        
        /* Bồng bềnh nhẹ nhàng như trong nước */
        @keyframes float { 
            0% { transform: translateY(-20px) rotateX(5deg) rotateY(-5deg); } 
            100% { transform: translateY(20px) rotateX(-5deg) rotateY(5deg); } 
        }
        
        /* Phân bố 5 tấm kính trong không gian */
        .c1 { left: 10%; top: 20%; animation-delay: 0s; z-index: 1;}
        .c2 { left: 30%; top: 40%; animation-delay: -2s; z-index: 3; transform: translateZ(100px);}
        .c3 { left: 50%; top: 15%; margin-left: -160px; animation-delay: -4s; z-index: 5; transform: translateZ(250px) scale(1.1);}
        .c4 { left: 70%; top: 30%; animation-delay: -1s; z-index: 2; transform: translateZ(50px);}
        .c5 { left: 80%; top: 50%; animation-delay: -3s; z-index: 4; transform: translateZ(150px);}
    </style>
</head>
<body>
    <div class="header"><h1>Floating Glassmorphism</h1><p>Parallax đa lớp & Hiệu ứng Kính Cường Lực</p></div>
    
    <div class="scene" id="scene">
        <div class="glass-card c1"><img src="album/IMG_4121.JPG"></div>
        <div class="glass-card c2"><img src="album/IMG_4125.JPG"></div>
        <div class="glass-card c3"><img src="album/IMG_4140.JPG"></div>
        <div class="glass-card c4"><img src="album/IMG_4170.JPG"></div>
        <div class="glass-card c5"><img src="album/IMG_4197.JPG"></div>
    </div>
    
    <script>
        // Cả vũ trụ kính mờ sẽ nghiêng vát theo con trỏ chuột
        const scene = document.getElementById('scene');
        window.addEventListener('mousemove', e => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 25; // Xoay Y
            let yAxis = (window.innerHeight / 2 - e.pageY) / 25; // Xoay X
            scene.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
        
        // Hồi phục lại vị trí trung tâm khi chuột ra ngoài
        window.addEventListener('mouseleave', () => {
            scene.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
