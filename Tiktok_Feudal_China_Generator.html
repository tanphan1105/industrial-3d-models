    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const PANEL_W = 650;
        const PANEL_H = 650; // Đã lùn lại thành hình vuông để tiết kiệm không gian

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                }
                else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
            return y + lineHeight; 
        }

        function generate() {
            const rawText = document.getElementById('profiles').value;
            const blocks = rawText.split('[HỒ SƠ]').filter(b => b.trim() !== '');
            
            // KỊCH KIM EFFECT HOUSE: Lưới 6 cột x 4 hàng = 24 tấm (3900x3800 px) < 4096px
            const COLUMNS = 6;
            const ROWS = Math.ceil(blocks.length / COLUMNS);
            
            canvas.width = PANEL_W * COLUMNS;
            canvas.height = PANEL_H * ROWS;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            blocks.forEach((block, index) => {
                const col = index % COLUMNS;
                const row = Math.floor(index / COLUMNS);
                const startX = col * PANEL_W;
                const startY = row * PANEL_H;
                
                ctx.save();
                // Di chuyển mốc toạ độ về góc trên bên trái của Ô hiện tại trong Lưới
                ctx.translate(startX, startY);
                
                const lines = block.split('\n').map(l => l.trim()).filter(l => l !== '');
                
                let data = {};
                lines.forEach(l => {
                    const splitIdx = l.indexOf(':');
                    if(splitIdx > -1) {
                        data[l.substring(0, splitIdx).trim()] = l.substring(splitIdx+1).trim();
                    }
                });

                const margin = 20;
                
                // 1. Vẽ nền Panel
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = 'rgba(10, 20, 35, 0.85)'; 
                ctx.beginPath();
                ctx.roundRect(margin, margin, PANEL_W - margin*2, PANEL_H - margin*2, 20);
                ctx.fill();
                
                // 2. Vẽ viền Neon phát sáng
                ctx.strokeStyle = '#00f2fe';
                ctx.lineWidth = 5;
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 25; 
                ctx.stroke();
                ctx.shadowBlur = 0; 
                
                // Header Line
                ctx.fillStyle = 'rgba(0, 242, 254, 0.2)';
                ctx.fillRect(margin+5, margin+5, PANEL_W - margin*2 - 10, 80);
                
                // Tiêu đề nhỏ
                ctx.fillStyle = '#00f2fe';
                ctx.font = 'bold 22px Courier New';
                ctx.textAlign = 'left';
                ctx.fillText('[ HỆ THỐNG TRUY NÃ ]', 50, 60);
                
                // Vẽ Barcode và Mã Số (Góc Phải Trên)
                let bcX = PANEL_W - 200;
                let bcY = 35;
                ctx.fillStyle = 'rgba(0, 242, 254, 0.6)';
                for(let i=0; i<30; i++) {
                    let w = ((index + i) % 5) * 1.5 + 1;
                    if((index * 7 + i) % 3 !== 0) {
                        ctx.fillRect(bcX, bcY, w, 25);
                    }
                    bcX += w + 2;
                }
                ctx.fillStyle = '#00f2fe';
                ctx.font = 'bold 14px Courier New';
                ctx.textAlign = 'right';
                ctx.fillText('ID: 9527-' + index.toString().padStart(3, '0'), PANEL_W - 30, 75);
                
                // Chữ To Chính (Lấy từ Ô nhập liệu)
                const panelTitle = document.getElementById('panelTitle').value.toUpperCase();
                ctx.fillStyle = '#ffffff';
                let titleFontSize = 36;
                if(panelTitle.length > 20) titleFontSize = 26;
                ctx.font = 'bold ' + (titleFontSize + 2) + 'px "Palatino Linotype", "Book Antiqua", Georgia, serif';
                ctx.textAlign = 'center';
                ctx.fillText(panelTitle, PANEL_W/2, 150);
                
                // Đã gỡ bỏ khung Avatar để bảng nhìn thoáng và rộng hơn

                // ==================== THÔNG TIN BÊN TRÁI ====================
                let textY = 240;
                ctx.textAlign = 'left';
                
                const drawField = (label, value, isLong = false, color = '#ffffff') => {
                    ctx.font = 'bold 24px "Palatino Linotype", "Book Antiqua", Georgia, serif';
                    ctx.fillStyle = '#00f2fe'; 
                    ctx.fillText(label + ':', 50, textY);
                    
                    if(value) {
                        ctx.font = 'bold 24px "Palatino Linotype", "Book Antiqua", Georgia, serif';
                        ctx.fillStyle = color;
                        
                        if(isLong) {
                            textY += 35; 
                            textY = wrapText(ctx, value, 50, textY, PANEL_W - 100, 34);
                            textY += 20; 
                        } else {
                            let newY = wrapText(ctx, value, 250, textY, 350, 34);
                            textY = Math.max(textY + 45, newY + 15);
                        }
                    } else {
                        textY += 45;
                    }
                };

                // Bỏ dòng Tên tội phạm, in thẳng Nơi lẩn trốn
                drawField('Nơi lẩn trốn', data['Nơi lẩn trốn']);
                
                // Phân cách - Đẩy lên cao hơn (320 thay vì 430) do bảng đã lùn đi
                textY = Math.max(textY, 320); 
                
                ctx.strokeStyle = 'rgba(0, 242, 254, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(50, textY - 15);
                ctx.lineTo(PANEL_W - 50, textY - 15);
                ctx.stroke();
                
                // Vẽ hộp nền đỏ cho Tội danh & Tiền thưởng
                let redBoxY = textY - 10;
                let boxHeight = (PANEL_H - 30) - redBoxY;
                ctx.fillStyle = 'rgba(255, 0, 0, 0.15)'; 
                ctx.fillRect(30, redBoxY, PANEL_W - 60, boxHeight);
                
                textY += 20; 
                drawField('Tội danh', data['Tội danh'], true, '#ff7b72'); 
                
                if (data['Tiền thưởng']) {
                    textY += 15;
                    drawField('Tiền thưởng', data['Tiền thưởng'], true, '#ffd700'); 
                }
                
                // ==================== ĐÓNG DẤU MỘC ĐỎ TUYÊN ÁN ====================
                if (data['Tuyên án']) {
                    // Di chuyển mốc tọa độ đến góc dưới bên phải
                    ctx.translate(PANEL_W - 160, PANEL_H - 120); 
                    ctx.rotate(-0.35); 
                    
                    ctx.strokeStyle = 'rgba(255, 60, 60, 0.85)'; 
                    ctx.lineWidth = 6;
                    ctx.strokeRect(-120, -35, 240, 70); 
                    
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-110, -25, 220, 50); 
                    
                    ctx.fillStyle = 'rgba(255, 60, 60, 0.85)';
                    ctx.font = '900 36px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(data['Tuyên án'].toUpperCase(), 0, 0); 
                }
                
                // ==================== VÂN TAY ĐIỂM CHỈ ====================
                ctx.restore(); // Phục hồi tọa độ ban đầu để xóa ảnh hưởng của Mộc Đỏ
                ctx.save();
                ctx.translate(startX, startY);
                
                ctx.translate(margin + 70, PANEL_H - margin - 70); 
                ctx.rotate(-0.2);
                ctx.strokeStyle = 'rgba(255, 30, 30, 0.5)';
                ctx.lineWidth = 3;
                ctx.setLineDash([4, 4, 8, 3, 2, 5]); 
                ctx.shadowColor = 'rgba(255, 0, 0, 0.8)';
                ctx.shadowBlur = 5;
                
                // Vẽ các vòng elip đồng tâm đứt đoạn tạo hiệu ứng vân tay
                for(let r=5; r<45; r+=5) {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r*0.7, r, 0, 0, Math.PI*2);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
                
                // Vết mực dơ (Ink smudges)
                ctx.fillStyle = 'rgba(255, 30, 30, 0.15)';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(10, 15, 15, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-15, -10, 12, 0, Math.PI*2);
                ctx.fill();
                
                ctx.restore(); // Phục hồi mốc tọa độ (0,0) cho thẻ tiếp theo
            });
        }
        
        function downloadGrid() {
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width / 2;
            exportCanvas.height = canvas.height / 2;
            const eCtx = exportCanvas.getContext('2d');
            eCtx.scale(0.5, 0.5);
            eCtx.drawImage(canvas, 0, 0);
            const link = document.createElement('a');
            link.download = 'Lenh_Truy_Na_Grid_Small.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }

        function downloadZIP() {
            if (typeof JSZip === 'undefined') {
                alert("Đang tải thư viện ZIP, vui lòng đợi vài giây và thử lại!");
                return;
            }
            const zip = new JSZip();
            const blocks = document.getElementById('profiles').value.split('[HỒ SƠ]').filter(b => b.trim() !== '');
            
            const COLUMNS = 6;
            for(let i=0; i<blocks.length; i++) {
                const singleCanvas = document.createElement('canvas');
                singleCanvas.width = PANEL_W;
                singleCanvas.height = PANEL_H;
                const sCtx = singleCanvas.getContext('2d');
                
                const col = i % COLUMNS;
                const row = Math.floor(i / COLUMNS);
                const sx = col * PANEL_W;
                const sy = row * PANEL_H;
                
                sCtx.drawImage(canvas, sx, sy, PANEL_W, PANEL_H, 0, 0, PANEL_W, PANEL_H);
                
                const base64Data = singleCanvas.toDataURL('image/png').split(',')[1];
                let num = (i + 1).toString().padStart(2, '0'); 
                zip.file(`TruyNa_${num}.png`, base64Data, {base64: true});
            }
            
            zip.generateAsync({type:"blob"}).then(function(content) {
                const link = document.createElement('a');
                link.download = "Bo_Truy_Na_Effect_House.zip";
                link.href = URL.createObjectURL(content);
                link.click();
            });
        }
        
        window.onload = generate;
    </script>

    <div style="background:#18181B; border:1.5px solid #3F3F46; border-radius:24px; padding:2.2rem 2rem; max-width:380px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(16,185,129,0.15); display:flex; flex-direction:column; align-items:center; gap:1.2rem;">

      <div>
        <h2 style="font-size:1.25rem; font-weight:800; color:#FFF; margin-bottom:0.35rem; letter-spacing:-0.01em;">WaterTreatment3D</h2>
        <p style="font-size:0.82rem; color:#A1A1AA; font-weight:500;">Bảo mật SHA-256 • Nhập mã PIN để truy cập</p>
      </div>
      <form id="pin-form" onsubmit="verifyPin(event)" style="width:100%; display:flex; flex-direction:column; gap:0.9rem;">
        <input type="password" id="pin-input" maxlength="10" placeholder="••••" autocomplete="current-password" autofocus style="width:100%; padding:0.9rem; background:#09090B; border:2px solid #3F3F46; border-radius:14px; color:#FFF; font-size:1.6rem; text-align:center; letter-spacing:0.4em; outline:none; font-family:'JetBrains Mono',monospace; transition:all 0.2s;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='#3F3F46'">
        <div id="pin-error" style="font-size:0.78rem; color:#EF4444; font-weight:700; min-height:1.2rem; display:none;">⚠️ Mã PIN không chính xác!</div>
        <button type="submit" style="width:100%; padding:0.9rem; background:linear-gradient(135deg, #10B981, #059669); border:none; border-radius:14px; color:#FFF; font-size:0.95rem; font-weight:800; cursor:pointer; box-shadow:0 4px 16px rgba(16,185,129,0.35); transition:transform 0.1s;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">MỞ KHÓA TRUY CẬP</button>

      <script id="wt3d-sha256-auth-script">
    const _WT3D_HASH = "748beb64b07dca157b83bbeb90e1abd407dba3ad959ff072de7ad0f6192e2b7b";
    function _wt3dSha256(ascii) {
      function r(v, a) { return (v >>> a) | (v << (32 - a)); }
      var m = Math.pow, mw = m(2, 32), lp = 'length', i, j, res = '',
          w = [], abl = ascii[lp] * 8, h = [], k = [], pc = 0, ic = {};
      for (var c = 2; pc < 64; c++) {
        if (!ic[c]) {
          for (i = 0; i < 313; i += c) ic[i] = c;
          h[pc] = (m(c, .5) * mw) | 0;
          k[pc++] = (m(c, 1 / 3) * mw) | 0;
        }
      }
      ascii += '\x80';
      while (ascii[lp] % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lp]; i++) {
        j = ascii.charCodeAt(i);
        w[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      w[w[lp]] = ((abl / mw) | 0);
      w[w[lp]] = (abl);
      for (j = 0; j < w[lp];) {
        var ws = w.slice(j, j += 16), oh = h.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = ws[i - 15], w2 = ws[i - 2], a = h[0], e = h[4],
              t1 = h[7] + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & h[5]) ^ ((~e) & h[6])) + k[i] +
              (ws[i] = (i < 16) ? ws[i] : (ws[i - 16] + (r(w15, 7) ^ r(w15, 18) ^ (w15 >>> 3)) + ws[i - 7] + (r(w2, 17) ^ r(w2, 19) ^ (w2 >>> 10))) | 0),
              t2 = (r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
          h = [(t1 + t2) | 0].concat(h);
          h[4] = (h[4] + t1) | 0;
          h.pop();
        }
        for (i = 0; i < 8; i++) h[i] = (h[i] + oh[i]) | 0;
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          var b = (h[i] >> (j * 8)) & 255;
          res += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return res;
    }
    function _verifyPinHash(pin) {
      return _wt3dSha256("WT3D_SALT_v2_" + String(pin).trim() + "_TANPHAN") === _WT3D_HASH;
    }
    function checkAuth() {
      const gate = document.getElementById("wt3d-pin-gate");
      if (localStorage.getItem("wt3d_vault_sha256") === _WT3D_HASH || sessionStorage.getItem("wt3d_vault_sha256") === _WT3D_HASH) {
        if (gate) gate.style.display = "none";
      } else {
        if (gate) gate.style.display = "flex";
      }
    }
    function verifyPin(e) {
      if (e) e.preventDefault();
      const inp = document.getElementById("pin-input");
      const pin = inp ? inp.value.trim() : "";
      const err = document.getElementById("pin-error");
      if (_verifyPinHash(pin)) {
        localStorage.setItem("wt3d_vault_sha256", _WT3D_HASH);
        sessionStorage.setItem("wt3d_vault_sha256", _WT3D_HASH);
        const gate = document.getElementById("wt3d-pin-gate");
        if (gate) {
          gate.style.transition = "opacity 0.25s ease";
          gate.style.opacity = "0";
          setTimeout(() => gate.style.display = "none", 250);
        }
      } else {
        if (err) err.style.display = "block";
        if (inp) {
          inp.style.borderColor = "#EF4444";
          inp.value = "";
          inp.focus();
        }
      }
    }
    function lockStudio() {
      localStorage.removeItem("wt3d_vault_sha256");
      sessionStorage.removeItem("wt3d_vault_sha256");
      localStorage.removeItem("wt3d_auth_2026");
      localStorage.removeItem("wt3d_pin_auth");
      location.reload();
    }
    checkAuth();
  </script>
