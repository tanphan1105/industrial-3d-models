<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>OMWATER V5 - Infinite Marquee</title>
    <style>
        body { margin: 0; background: #f3f3f5; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, sans-serif;}
        .header { margin-bottom: 60px; text-align: center; }
        .header h1 { font-size: 46px; margin: 0; color: #111; letter-spacing: -1px; }
        
        .marquee-wrapper { width: 100vw; overflow: hidden; padding: 50px 0; cursor: ns-resize; }
        .track { display: flex; gap: 30px; width: fit-content; will-change: transform; }
        
        .card { 
            width: 450px; 
            height: 320px; 
            flex-shrink: 0; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .hint { margin-top: 50px; background: #fff; padding: 10px 30px; border-radius: 30px; font-weight: bold; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="header"><h1>Infinite Skewed Marquee</h1></div>
    <div class="marquee-wrapper">
        <div class="track" id="track"></div>
    </div>
    <div class="hint">CUỘN CHUỘT THẬT NHANH ĐỂ TĂNG TỐC & XÔ NGHIÊNG</div>
    
    <script>
        const track = document.getElementById('track');
        const images = ['IMG_4121.JPG','IMG_4125.JPG','IMG_4140.JPG','IMG_4170.JPG','IMG_4197.JPG','IMG_4198.JPG','IMG_4230.JPG'];
        const CARD_WIDTH = 480; // 450 + 30 gap
        
        // Nhân bản dải ảnh làm 3 lần để tạo vòng lặp vô tận không bị hở sườn
        [...images, ...images, ...images].forEach(src => {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="album/${src}">`;
            track.appendChild(card);
        });

        let currentX = 0;
        let baseSpeed = 1.5; // Tốc độ trôi rề rề cơ bản
        let scrollVelocity = 0;

        window.addEventListener('wheel', e => {
            // Khi cuộn chuột, cộng dồn gia tốc
            scrollVelocity += e.deltaY * 0.08;
        });

        function animate() {
            // Giảm xóc quán tính (Damping): vận tốc giảm dần về 0
            scrollVelocity *= 0.92; 
            
            // Tổng vận tốc di chuyển
            let totalSpeed = baseSpeed + scrollVelocity;
            currentX -= totalSpeed;
            
            // Vòng lặp vô tận: Nếu dải chạy quá 1 list, dịch chuyển nó giật lùi lại 1 list (Không ai nhận ra)
            let loopWidth = CARD_WIDTH * images.length;
            if (currentX < -loopWidth * 2) {
                currentX += loopWidth;
            } else if (currentX > 0) {
                currentX -= loopWidth;
            }

            // Kỹ thuật SKEW: Vận tốc càng nhanh, dải ảnh xô nghiêng càng mạnh do gió
            // Giới hạn nghiêng tối đa 25 độ
            let skew = Math.max(-25, Math.min(25, totalSpeed * 0.5));
            
            track.style.transform = `translateX(${currentX}px) skewX(${-skew}deg)`;
            
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
