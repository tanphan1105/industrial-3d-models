<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>OMWATER V5 - Spatial UI</title>
    <style>
        body { 
            margin: 0; 
            background: url('album/IMG_4170.JPG') no-repeat center/cover; 
            overflow: hidden; font-family: -apple-system, sans-serif; 
            display: flex; justify-content: center; align-items: flex-end; 
            height: 100vh; perspective: 1200px; 
        }
        
        /* Màn sương làm mờ nền (Backdrop Filter) */
        .backdrop { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            backdrop-filter: blur(5px); background: rgba(0,0,0,0.3); z-index: 0; 
            transition: all 0.8s ease; 
        }
        
        .backdrop.active {
            backdrop-filter: blur(40px); background: rgba(0,0,0,0.7);
        }
        
        .header { position: absolute; top: 40px; color: #fff; z-index: 2; text-align: center; transition: opacity 0.5s; pointer-events: none;}
        .header h1 { font-size: 46px; margin: 0; letter-spacing: -1px; text-shadow: 0 5px 15px rgba(0,0,0,0.5);}
        
        /* Thanh Dock chứa Icon bên dưới */
        .dock { 
            display: flex; gap: 20px; 
            background: rgba(255,255,255,0.15); padding: 15px 30px; 
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.3); 
            backdrop-filter: blur(30px); margin-bottom: 40px; z-index: 10; 
            transform: translateZ(50px); box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: transform 0.5s;
        }
        
        .thumb { 
            width: 70px; height: 70px; border-radius: 16px; cursor: pointer; 
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), margin 0.3s; 
            border: 2px solid transparent;
        }
        
        .thumb:hover { 
            transform: scale(1.4) translateY(-15px); margin: 0 15px; 
            border: 2px solid rgba(255,255,255,0.8); box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }

        /* Cửa sổ Kính khổng lồ (Spatial Window) */
        .spatial-window { 
            position: absolute; left: 50%; top: 50%; 
            /* Khởi đầu: Nhỏ tí, lùi sâu về phía sau màn hình (-1000px) và tàng hình */
            transform: translate(-50%, -50%) translateZ(-1000px) scale(0.3); 
            opacity: 0; 
            width: 80vw; max-width: 1200px; height: 75vh; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.3); 
            border-radius: 30px; overflow: hidden; box-shadow: 0 50px 100px rgba(0,0,0,0.8); 
            backdrop-filter: blur(20px); 
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); 
            z-index: 5; pointer-events: none;
        }
        
        /* Khi kích hoạt: Lao vút ra phía trước, nở to ra sát mặt người xem (TranslateZ 200px) */
        .spatial-window.active { 
            transform: translate(-50%, -50%) translateZ(200px) scale(1); 
            opacity: 1; pointer-events: auto; 
        }
        
        .spatial-window img { width: 100%; height: 100%; object-fit: cover; }
        
        .close-btn { 
            position: absolute; top: 25px; right: 25px; 
            background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.3); 
            border-radius: 50%; width: 50px; height: 50px; cursor: pointer; 
            font-size: 24px; backdrop-filter: blur(10px); transition: 0.3s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.9); color: #000; transform: scale(1.1);}
    </style>
</head>
<body>
    <div class="backdrop" id="backdrop"></div>
    <div class="header" id="header"><h1>Apple Spatial UI / Vision Pro</h1></div>
    
    <div class="spatial-window" id="window">
        <button class="close-btn" onclick="closeWindow()">×</button>
        <img id="main-img" src="">
    </div>
    
    <div class="dock" id="dock">
        <div class="thumb" onclick="openWindow('album/IMG_4121.JPG')"><img src="album/IMG_4121.JPG"></div>
        <div class="thumb" onclick="openWindow('album/IMG_4125.JPG')"><img src="album/IMG_4125.JPG"></div>
        <div class="thumb" onclick="openWindow('album/IMG_4140.JPG')"><img src="album/IMG_4140.JPG"></div>
        <div class="thumb" onclick="openWindow('album/IMG_4170.JPG')"><img src="album/IMG_4170.JPG"></div>
        <div class="thumb" onclick="openWindow('album/IMG_4197.JPG')"><img src="album/IMG_4197.JPG"></div>
        <div class="thumb" onclick="openWindow('album/IMG_4230.JPG')"><img src="album/IMG_4230.JPG"></div>
    </div>
    
    <script>
        const spatialWindow = document.getElementById('window');
        const mainImg = document.getElementById('main-img');
        const backdrop = document.getElementById('backdrop');
        const header = document.getElementById('header');
        const dock = document.getElementById('dock');

        function openWindow(src) {
            mainImg.src = src;
            spatialWindow.classList.add('active');
            backdrop.classList.add('active');
            header.style.opacity = '0';
            dock.style.transform = 'translateZ(50px) translateY(150px)'; // Giấu dock đi
        }

        function closeWindow() {
            spatialWindow.classList.remove('active');
            backdrop.classList.remove('active');
            header.style.opacity = '1';
            dock.style.transform = 'translateZ(50px) translateY(0)'; // Hiện dock lại
        }
    </script>

<!-- 🔒 WT3D ENCRYPTED SHA-256 PIN GATE OVERLAY -->
  <div id="wt3d-pin-gate" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(9,9,11,0.96); backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px); z-index:999999; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:1.5rem; color:#FFF; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;">
    <div style="background:#18181B; border:1.5px solid #3F3F46; border-radius:24px; padding:2.2rem 2rem; max-width:380px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(16,185,129,0.15); display:flex; flex-direction:column; align-items:center; gap:1.2rem;">
      <div style="width:64px; height:64px; background:linear-gradient(135deg, #10B981, #059669); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.8rem; box-shadow:0 8px 24px rgba(16,185,129,0.4);">
        🔒
      </div>
      <div>
        <h2 style="font-size:1.25rem; font-weight:800; color:#FFF; margin-bottom:0.35rem; letter-spacing:-0.01em;">WaterTreatment3D</h2>
        <p style="font-size:0.82rem; color:#A1A1AA; font-weight:500;">Bảo mật SHA-256 • Nhập mã PIN để truy cập</p>
      </div>
      <form id="pin-form" onsubmit="verifyPin(event)" style="width:100%; display:flex; flex-direction:column; gap:0.9rem;">
        <input type="password" id="pin-input" maxlength="10" placeholder="••••" autocomplete="current-password" autofocus style="width:100%; padding:0.9rem; background:#09090B; border:2px solid #3F3F46; border-radius:14px; color:#FFF; font-size:1.6rem; text-align:center; letter-spacing:0.4em; outline:none; font-family:'JetBrains Mono',monospace; transition:all 0.2s;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='#3F3F46'">
        <div id="pin-error" style="font-size:0.78rem; color:#EF4444; font-weight:700; min-height:1.2rem; display:none;">⚠️ Mã PIN không chính xác!</div>
        <button type="submit" style="width:100%; padding:0.9rem; background:linear-gradient(135deg, #10B981, #059669); border:none; border-radius:14px; color:#FFF; font-size:0.95rem; font-weight:800; cursor:pointer; box-shadow:0 4px 16px rgba(16,185,129,0.35); transition:transform 0.1s;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">MỞ KHÓA TRUY CẬP</button>
      </form>
      <div style="font-size:0.72rem; color:#71717A;">Bản quyền © WaterTreatment3D | Phan Trọng Tấn</div>
    </div>
  </div>
      <script id="wt3d-sha256-auth-script">
    const _WT3D_HASH = "748beb64b07dca157b83bbeb90e1abd407dba3ad959ff072de7ad0f6192e2b7b";
    function _wt3dSha256(ascii) {
      function r(v, a) { return (v >>> a) | (v << (32 - a)); }
      var m = Math.pow, mw = m(2, 32), lp = 'length', i, j, res = '',
          w = [], abl = ascii[lp] * 8, h = [], k = [], pc = 0, ic = {};
      for (var c = 2; pc < 64; c++) {
        if (!ic[c]) {
          for (i = 0; i < 313; i += c) ic[i] = c;
          h[pc] = (m(c, .5) * mw) | 0;
          k[pc++] = (m(c, 1 / 3) * mw) | 0;
        }
      }
      ascii += '\x80';
      while (ascii[lp] % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lp]; i++) {
        j = ascii.charCodeAt(i);
        w[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      w[w[lp]] = ((abl / mw) | 0);
      w[w[lp]] = (abl);
      for (j = 0; j < w[lp];) {
        var ws = w.slice(j, j += 16), oh = h.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = ws[i - 15], w2 = ws[i - 2], a = h[0], e = h[4],
              t1 = h[7] + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & h[5]) ^ ((~e) & h[6])) + k[i] +
              (ws[i] = (i < 16) ? ws[i] : (ws[i - 16] + (r(w15, 7) ^ r(w15, 18) ^ (w15 >>> 3)) + ws[i - 7] + (r(w2, 17) ^ r(w2, 19) ^ (w2 >>> 10))) | 0),
              t2 = (r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
          h = [(t1 + t2) | 0].concat(h);
          h[4] = (h[4] + t1) | 0;
          h.pop();
        }
        for (i = 0; i < 8; i++) h[i] = (h[i] + oh[i]) | 0;
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          var b = (h[i] >> (j * 8)) & 255;
          res += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return res;
    }
    function _verifyPinHash(pin) {
      return _wt3dSha256("WT3D_SALT_v2_" + String(pin).trim() + "_TANPHAN") === _WT3D_HASH;
    }
    function checkAuth() {
      const gate = document.getElementById("wt3d-pin-gate");
      if (localStorage.getItem("wt3d_vault_sha256") === _WT3D_HASH || sessionStorage.getItem("wt3d_vault_sha256") === _WT3D_HASH) {
        if (gate) gate.style.display = "none";
      } else {
        if (gate) gate.style.display = "flex";
      }
    }
    function verifyPin(e) {
      if (e) e.preventDefault();
      const inp = document.getElementById("pin-input");
      const pin = inp ? inp.value.trim() : "";
      const err = document.getElementById("pin-error");
      if (_verifyPinHash(pin)) {
        localStorage.setItem("wt3d_vault_sha256", _WT3D_HASH);
        sessionStorage.setItem("wt3d_vault_sha256", _WT3D_HASH);
        const gate = document.getElementById("wt3d-pin-gate");
        if (gate) {
          gate.style.transition = "opacity 0.25s ease";
          gate.style.opacity = "0";
          setTimeout(() => gate.style.display = "none", 250);
        }
      } else {
        if (err) err.style.display = "block";
        if (inp) {
          inp.style.borderColor = "#EF4444";
          inp.value = "";
          inp.focus();
        }
      }
    }
    function lockStudio() {
      localStorage.removeItem("wt3d_vault_sha256");
      sessionStorage.removeItem("wt3d_vault_sha256");
      localStorage.removeItem("wt3d_auth_2026");
      localStorage.removeItem("wt3d_pin_auth");
      location.reload();
    }
    checkAuth();
  </script>
</body>
</html>
