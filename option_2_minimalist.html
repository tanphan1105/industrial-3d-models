<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Option 2: Refined Minimalist</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --tx: #111111; --tx-s: #888888; --ac: #000000;
  --ff-h: 'Syne', sans-serif; --ff-b: 'Inter', sans-serif;
}
body { font-family: var(--ff-b); background: var(--bg); color: var(--tx); margin: 0; }
nav { padding: 40px 80px; font-size: 14px; font-weight: 400; display: flex; justify-content: space-between; }
.hero {
  padding: 80px; min-height: 80vh; position: relative;
  display: flex; flex-direction: column; justify-content: center;
}
h1 {
  font-family: var(--ff-h); font-size: 120px; font-weight: 800; letter-spacing: -0.04em;
  margin: 0; line-height: 0.9; max-width: 800px; position: relative; z-index: 2; mix-blend-mode: difference; color: white;
}
.hero-text { position: relative; z-index: 2; margin-top: 40px; max-width: 400px; mix-blend-mode: difference; color: white; }
.btn {
  display: inline-block; padding: 16px 40px; border: 1px solid #fff; color: #fff;
  text-decoration: none; border-radius: 100px; margin-top: 40px; font-size: 14px;
}
model-viewer {
  position: absolute; right: 0; top: 0; width: 60%; height: 100%; z-index: 1;
}
.bg-fill { position: absolute; inset: 0; background: #fff; z-index: 0; }
</style>
</head>
<body>
<div class="bg-fill"></div>
<nav style="position:relative; z-index:10; mix-blend-mode: difference; color: white;">
  <div>Trong Tan Phan — Industrial 3D</div>
  <div>2026 Collection</div>
</nav>
<section class="hero">
  <h1>Water Treatment.</h1>
  <div class="hero-text">
    <p>Engineering-accurate 3D models of Reverse Osmosis Systems and filtration skids. Purified design for complex machinery.</p>
    <a href="#" class="btn">Explore Collection</a>
  </div>
  <model-viewer src="3d_Industrial_Ozone_Generator.glb" auto-rotate camera-controls shadow-intensity="0.5" exposure="0.8"></model-viewer>
</section>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</body>
</html>
