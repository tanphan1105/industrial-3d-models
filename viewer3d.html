<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer - Bồn Johkasou FRP 6m3/ngày</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Model Viewer component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root {
            --bg-color: #020617;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        header {
            width: 100%;
            padding: 24px;
            text-align: center;
            background: linear-gradient(180deg, rgba(2, 6, 23, 0.8) 0%, rgba(2, 6, 23, 0) 100%);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            font-size: 12px;
            color: var(--text-secondary);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* 3D Model Viewer Container */
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            --poster-color: transparent;
        }

        /* Custom AR Button */
        #ar-button {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"/></svg>');
            background-repeat: no-repeat;
            background-position: 20px center;
            background-size: 20px;
            background-color: var(--accent);
            color: white;
            border-radius: 50px;
            border: none;
            padding: 14px 28px 14px 50px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px var(--accent-glow);
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #ar-button:hover {
            background-color: #2563eb;
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.4);
            transform: translateX(-50%) scale(1.05);
        }

        #ar-button:active {
            transform: translateX(-50%) scale(0.98);
        }

        /* Loading UI */
        .progress-bar {
            display: block;
            width: 33%;
            height: 4px;
            max-width: 250px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            z-index: 5;
        }

        .progress-bar.hide {
            display: none;
        }

        .update-bar {
            background-color: var(--accent);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }

        /* Controls hint overlay */
        .instruction-overlay {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--text-secondary);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.05);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 0.9; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <header>
        <h1>BỒN JOHKASOU FRP 6M3/DAY</h1>
        <p>OMWATER • H2L INTERFACE 3D MODEL</p>
    </header>

    <!-- Google Model Viewer -->
    <model-viewer 
        src="CHI TIET GIA CONG BON FRP.glb" 
        ios-src="piping frp tank.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        interaction-prompt="auto"
        shadow-intensity="1.5"
        shadow-softness="0.8"
        exposure="1.2"
        environment-image="neutral"
        alt="Bản vẽ 3D thiết kế bồn thô FRP Johkasou 6m3/day">
        
        <div class="progress-bar" slot="progress-bar">
            <div class="update-bar"></div>
        </div>

        <button slot="ar-button" id="ar-button">
            XEM AR 3D THỰC TẾ (1:1 SCALE)
        </button>

        <div class="instruction-overlay">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            <span>Dùng 1 ngón để xoay • 2 ngón để phóng to/thu nhỏ</span>
        </div>
    </model-viewer>

    <script>
        // Loading Progress Bar
        const onProgress = (event) => {
            const progressBar = event.target.querySelector('.progress-bar');
            const updatingBar = event.target.querySelector('.update-bar');
            if (progressBar && updatingBar) {
                updatingBar.style.width = `${event.detail.totalProgress * 100}%`;
                if (event.detail.totalProgress === 1) {
                    progressBar.classList.add('hide');
                }
            }
        };
        document.querySelector('model-viewer').addEventListener('progress', onProgress);
    </script>
</body>
</html>
