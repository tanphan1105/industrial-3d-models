<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer - Bồn Johkasou FRP 6m3/ngày</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Model Viewer component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root {
            --bg-color: #020617;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        header {
            width: 100%;
            padding: 24px;
            text-align: center;
            background: linear-gradient(180deg, rgba(2, 6, 23, 0.8) 0%, rgba(2, 6, 23, 0) 100%);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            font-size: 12px;
            color: var(--text-secondary);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* 3D Model Viewer Container */
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            --poster-color: transparent;
        }

        /* Custom AR Button */
        #ar-button {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"/></svg>');
            background-repeat: no-repeat;
            background-position: 20px center;
            background-size: 20px;
            background-color: var(--accent);
            color: white;
            border-radius: 50px;
            border: none;
            padding: 14px 28px 14px 50px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px var(--accent-glow);
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #ar-button:hover {
            background-color: #2563eb;
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.4);
            transform: translateX(-50%) scale(1.05);
        }

        #ar-button:active {
            transform: translateX(-50%) scale(0.98);
        }

        /* Loading UI */
        .progress-bar {
            display: block;
            width: 33%;
            height: 4px;
            max-width: 250px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            z-index: 5;
        }

        .progress-bar.hide {
            display: none;
        }

        .update-bar {
            background-color: var(--accent);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }

        /* Controls hint overlay */
        .instruction-overlay {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--text-secondary);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.05);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 0.9; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <header>
        <h1>BỒN JOHKASOU FRP 6M3/DAY</h1>
        <p>OMWATER • H2L INTERFACE 3D MODEL</p>
    </header>

    <!-- Google Model Viewer -->
    <model-viewer 
        src="CHI TIET GIA CONG BON FRP.glb" 
        ios-src="piping frp tank.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        interaction-prompt="auto"
        shadow-intensity="1.5"
        shadow-softness="0.8"
        exposure="1.2"
        environment-image="neutral"
        alt="Bản vẽ 3D thiết kế bồn thô FRP Johkasou 6m3/day">
        
        <div class="progress-bar" slot="progress-bar">
            <div class="update-bar"></div>
        </div>

        <button slot="ar-button" id="ar-button">
            XEM AR 3D THỰC TẾ (1:1 SCALE)
        </button>

        <div class="instruction-overlay">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            <span>Dùng 1 ngón để xoay • 2 ngón để phóng to/thu nhỏ</span>
        </div>
    </model-viewer>

    <script>
        // Loading Progress Bar
        const onProgress = (event) => {
            const progressBar = event.target.querySelector('.progress-bar');
            const updatingBar = event.target.querySelector('.update-bar');
            if (progressBar && updatingBar) {
                updatingBar.style.width = `${event.detail.totalProgress * 100}%`;
                if (event.detail.totalProgress === 1) {
                    progressBar.classList.add('hide');
                }
            }
        };
        document.querySelector('model-viewer').addEventListener('progress', onProgress);
    </script>

<!-- 🔒 WT3D ENCRYPTED SHA-256 PIN GATE OVERLAY -->
  <div id="wt3d-pin-gate" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(9,9,11,0.96); backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px); z-index:999999; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:1.5rem; color:#FFF; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;">
    <div style="background:#18181B; border:1.5px solid #3F3F46; border-radius:24px; padding:2.2rem 2rem; max-width:380px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(16,185,129,0.15); display:flex; flex-direction:column; align-items:center; gap:1.2rem;">
      <div style="width:64px; height:64px; background:linear-gradient(135deg, #10B981, #059669); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.8rem; box-shadow:0 8px 24px rgba(16,185,129,0.4);">
        🔒
      </div>
      <div>
        <h2 style="font-size:1.25rem; font-weight:800; color:#FFF; margin-bottom:0.35rem; letter-spacing:-0.01em;">WaterTreatment3D</h2>
        <p style="font-size:0.82rem; color:#A1A1AA; font-weight:500;">Bảo mật SHA-256 • Nhập mã PIN để truy cập</p>
      </div>
      <form id="pin-form" onsubmit="verifyPin(event)" style="width:100%; display:flex; flex-direction:column; gap:0.9rem;">
        <input type="password" id="pin-input" maxlength="10" placeholder="••••" autocomplete="current-password" autofocus style="width:100%; padding:0.9rem; background:#09090B; border:2px solid #3F3F46; border-radius:14px; color:#FFF; font-size:1.6rem; text-align:center; letter-spacing:0.4em; outline:none; font-family:'JetBrains Mono',monospace; transition:all 0.2s;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='#3F3F46'">
        <div id="pin-error" style="font-size:0.78rem; color:#EF4444; font-weight:700; min-height:1.2rem; display:none;">⚠️ Mã PIN không chính xác!</div>
        <button type="submit" style="width:100%; padding:0.9rem; background:linear-gradient(135deg, #10B981, #059669); border:none; border-radius:14px; color:#FFF; font-size:0.95rem; font-weight:800; cursor:pointer; box-shadow:0 4px 16px rgba(16,185,129,0.35); transition:transform 0.1s;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">MỞ KHÓA TRUY CẬP</button>
      </form>
      <div style="font-size:0.72rem; color:#71717A;">Bản quyền © WaterTreatment3D | Phan Trọng Tấn</div>
    </div>
  </div>
      <script id="wt3d-sha256-auth-script">
    const _WT3D_HASH = "748beb64b07dca157b83bbeb90e1abd407dba3ad959ff072de7ad0f6192e2b7b";
    function _wt3dSha256(ascii) {
      function r(v, a) { return (v >>> a) | (v << (32 - a)); }
      var m = Math.pow, mw = m(2, 32), lp = 'length', i, j, res = '',
          w = [], abl = ascii[lp] * 8, h = [], k = [], pc = 0, ic = {};
      for (var c = 2; pc < 64; c++) {
        if (!ic[c]) {
          for (i = 0; i < 313; i += c) ic[i] = c;
          h[pc] = (m(c, .5) * mw) | 0;
          k[pc++] = (m(c, 1 / 3) * mw) | 0;
        }
      }
      ascii += '\x80';
      while (ascii[lp] % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lp]; i++) {
        j = ascii.charCodeAt(i);
        w[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      w[w[lp]] = ((abl / mw) | 0);
      w[w[lp]] = (abl);
      for (j = 0; j < w[lp];) {
        var ws = w.slice(j, j += 16), oh = h.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = ws[i - 15], w2 = ws[i - 2], a = h[0], e = h[4],
              t1 = h[7] + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & h[5]) ^ ((~e) & h[6])) + k[i] +
              (ws[i] = (i < 16) ? ws[i] : (ws[i - 16] + (r(w15, 7) ^ r(w15, 18) ^ (w15 >>> 3)) + ws[i - 7] + (r(w2, 17) ^ r(w2, 19) ^ (w2 >>> 10))) | 0),
              t2 = (r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
          h = [(t1 + t2) | 0].concat(h);
          h[4] = (h[4] + t1) | 0;
          h.pop();
        }
        for (i = 0; i < 8; i++) h[i] = (h[i] + oh[i]) | 0;
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          var b = (h[i] >> (j * 8)) & 255;
          res += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return res;
    }
    function _verifyPinHash(pin) {
      return _wt3dSha256("WT3D_SALT_v2_" + String(pin).trim() + "_TANPHAN") === _WT3D_HASH;
    }
    function checkAuth() {
      const gate = document.getElementById("wt3d-pin-gate");
      if (localStorage.getItem("wt3d_vault_sha256") === _WT3D_HASH || sessionStorage.getItem("wt3d_vault_sha256") === _WT3D_HASH) {
        if (gate) gate.style.display = "none";
      } else {
        if (gate) gate.style.display = "flex";
      }
    }
    function verifyPin(e) {
      if (e) e.preventDefault();
      const inp = document.getElementById("pin-input");
      const pin = inp ? inp.value.trim() : "";
      const err = document.getElementById("pin-error");
      if (_verifyPinHash(pin)) {
        localStorage.setItem("wt3d_vault_sha256", _WT3D_HASH);
        sessionStorage.setItem("wt3d_vault_sha256", _WT3D_HASH);
        const gate = document.getElementById("wt3d-pin-gate");
        if (gate) {
          gate.style.transition = "opacity 0.25s ease";
          gate.style.opacity = "0";
          setTimeout(() => gate.style.display = "none", 250);
        }
      } else {
        if (err) err.style.display = "block";
        if (inp) {
          inp.style.borderColor = "#EF4444";
          inp.value = "";
          inp.focus();
        }
      }
    }
    function lockStudio() {
      localStorage.removeItem("wt3d_vault_sha256");
      sessionStorage.removeItem("wt3d_vault_sha256");
      localStorage.removeItem("wt3d_auth_2026");
      localStorage.removeItem("wt3d_pin_auth");
      location.reload();
    }
    checkAuth();
  </script>
</body>
</html>
