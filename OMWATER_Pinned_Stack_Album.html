<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>OMWATER V5 - Pinned Stack</title>
    <style>
        body { 
            margin: 0; background: #000; font-family: -apple-system, sans-serif; color: #fff; 
        }
        
        .header { 
            text-align:center; padding: 100px 0; height: 50vh; display: flex; flex-direction: column; justify-content: center; 
        }
        .header h1 { font-size: 56px; margin: 0; letter-spacing: -2px; }
        
        /* Container chừa đủ khoảng trống để cuộn qua 4 tấm thẻ */
        .stack-container { width: 100%; padding-bottom: 50vh; position: relative; }
        
        .card { 
            /* Sticky là bí quyết: Khi thẻ chạm mép trên màn hình, nó sẽ bị ghim lại! */
            position: sticky; 
            height: 75vh; 
            width: 85vw; 
            max-width: 1200px;
            margin: 0 auto; 
            border-radius: 30px; 
            overflow: hidden; 
            box-shadow: 0 -30px 60px rgba(0,0,0,0.8); 
            transform-origin: top center; 
            transition: transform 0.1s linear, filter 0.1s linear; 
        }
        
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card .title { position: absolute; bottom: 40px; left: 40px; font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 30px; border-radius: 16px; backdrop-filter: blur(10px);}
        
        /* Thiết lập khoảng cách vị trí cuộn cho từng thẻ */
        .c1 { top: 10vh; z-index: 1;}
        .c2 { top: 12vh; z-index: 2; margin-top: 80vh; }
        .c3 { top: 14vh; z-index: 3; margin-top: 80vh; }
        .c4 { top: 16vh; z-index: 4; margin-top: 80vh; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Apple Pinned Stack Scroll</h1>
        <p>Cuộn chuột xuống để thấy hiệu ứng xếp chồng bài</p>
        <p style="font-size: 30px; margin-top: 50px;">↓</p>
    </div>
    
    <div class="stack-container" id="stack">
        <div class="card c1"><img src="album/IMG_4121.JPG"><div class="title">1. Nhập Thiết Bị</div></div>
        <div class="card c2"><img src="album/IMG_4125.JPG"><div class="title">2. Lắp Đặt Ống</div></div>
        <div class="card c3"><img src="album/IMG_4140.JPG"><div class="title">3. Trạm UV</div></div>
        <div class="card c4"><img src="album/IMG_4170.JPG"><div class="title">4. Vận Hành</div></div>
    </div>
    
    <script>
        // Thuật toán đo khoảng cách Scroll để làm tối và thu nhỏ các thẻ bị đè lên
        const cards = document.querySelectorAll('.card');
        
        window.addEventListener('scroll', () => {
            cards.forEach((card, index) => {
                const rect = card.getBoundingClientRect();
                let stickyTop = parseInt(window.getComputedStyle(card).top);
                
                // Nếu thẻ đang bị ghim (Pin) ở mép trên màn hình
                if (rect.top <= stickyTop + 1) { 
                    
                    // Đo khoảng cách tới thẻ TIẾP THEO đang cuộn lên
                    if (index < cards.length - 1) {
                        let nextCard = cards[index + 1];
                        let nextRect = nextCard.getBoundingClientRect();
                        let nextStickyTop = parseInt(window.getComputedStyle(nextCard).top);
                        let distanceToNext = nextRect.top - nextStickyTop;
                        
                        // Nếu thẻ tiếp theo đang ở gần (dưới 800px)
                        if (distanceToNext < window.innerHeight) {
                            let progress = 1 - (distanceToNext / window.innerHeight);
                            progress = Math.max(0, Math.min(progress, 1));
                            
                            // Thẻ hiện tại bị đè -> Thu nhỏ 5% và Tối đi 60%
                            let scale = 1 - (progress * 0.05); 
                            let brightness = 1 - (progress * 0.6); 
                            card.style.transform = `scale(${scale})`;
                            card.style.filter = `brightness(${brightness})`;
                        }
                    }
                } else {
                    // Nếu thẻ chưa bị ghim -> Sáng rõ 100%
                    card.style.transform = `scale(1)`;
                    card.style.filter = `brightness(1)`;
                }
            });
        });
    </script>

  <div id="wt3d-pin-gate" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(9,9,11,0.96); backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px); z-index:999999; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:1.5rem; color:#FFF; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;">

        <button type="submit" style="width:100%; padding:0.9rem; background:linear-gradient(135deg, #10B981, #059669); border:none; border-radius:14px; color:#FFF; font-size:0.95rem; font-weight:800; cursor:pointer; box-shadow:0 4px 16px rgba(16,185,129,0.35); transition:transform 0.1s;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">MỞ KHÓA TRUY CẬP</button>
      </form>
      <div style="font-size:0.72rem; color:#71717A;">Bản quyền © WaterTreatment3D | Phan Trọng Tấn</div>

      <script id="wt3d-sha256-auth-script">
    const _WT3D_HASH = "748beb64b07dca157b83bbeb90e1abd407dba3ad959ff072de7ad0f6192e2b7b";
    function _wt3dSha256(ascii) {
      function r(v, a) { return (v >>> a) | (v << (32 - a)); }
      var m = Math.pow, mw = m(2, 32), lp = 'length', i, j, res = '',
          w = [], abl = ascii[lp] * 8, h = [], k = [], pc = 0, ic = {};
      for (var c = 2; pc < 64; c++) {
        if (!ic[c]) {
          for (i = 0; i < 313; i += c) ic[i] = c;
          h[pc] = (m(c, .5) * mw) | 0;
          k[pc++] = (m(c, 1 / 3) * mw) | 0;
        }
      }
      ascii += '\x80';
      while (ascii[lp] % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lp]; i++) {
        j = ascii.charCodeAt(i);
        w[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      w[w[lp]] = ((abl / mw) | 0);
      w[w[lp]] = (abl);
      for (j = 0; j < w[lp];) {
        var ws = w.slice(j, j += 16), oh = h.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = ws[i - 15], w2 = ws[i - 2], a = h[0], e = h[4],
              t1 = h[7] + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & h[5]) ^ ((~e) & h[6])) + k[i] +
              (ws[i] = (i < 16) ? ws[i] : (ws[i - 16] + (r(w15, 7) ^ r(w15, 18) ^ (w15 >>> 3)) + ws[i - 7] + (r(w2, 17) ^ r(w2, 19) ^ (w2 >>> 10))) | 0),
              t2 = (r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
          h = [(t1 + t2) | 0].concat(h);
          h[4] = (h[4] + t1) | 0;
          h.pop();
        }
        for (i = 0; i < 8; i++) h[i] = (h[i] + oh[i]) | 0;
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          var b = (h[i] >> (j * 8)) & 255;
          res += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return res;
    }
    function _verifyPinHash(pin) {
      return _wt3dSha256("WT3D_SALT_v2_" + String(pin).trim() + "_TANPHAN") === _WT3D_HASH;
    }
    function checkAuth() {
      const gate = document.getElementById("wt3d-pin-gate");
      if (localStorage.getItem("wt3d_vault_sha256") === _WT3D_HASH || sessionStorage.getItem("wt3d_vault_sha256") === _WT3D_HASH) {
        if (gate) gate.style.display = "none";
      } else {
        if (gate) gate.style.display = "flex";
      }
    }
    function verifyPin(e) {
      if (e) e.preventDefault();
      const inp = document.getElementById("pin-input");
      const pin = inp ? inp.value.trim() : "";
      const err = document.getElementById("pin-error");
      if (_verifyPinHash(pin)) {
        localStorage.setItem("wt3d_vault_sha256", _WT3D_HASH);
        sessionStorage.setItem("wt3d_vault_sha256", _WT3D_HASH);
        const gate = document.getElementById("wt3d-pin-gate");
        if (gate) {
          gate.style.transition = "opacity 0.25s ease";
          gate.style.opacity = "0";
          setTimeout(() => gate.style.display = "none", 250);
        }
      } else {
        if (err) err.style.display = "block";
        if (inp) {
          inp.style.borderColor = "#EF4444";
          inp.value = "";
          inp.focus();
        }
      }
    }
    function lockStudio() {
      localStorage.removeItem("wt3d_vault_sha256");
      sessionStorage.removeItem("wt3d_vault_sha256");
      localStorage.removeItem("wt3d_auth_2026");
      localStorage.removeItem("wt3d_pin_auth");
      location.reload();
    }
    checkAuth();
  </script>
