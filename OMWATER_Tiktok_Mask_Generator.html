<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>OMWATER - Tiktok Mask Asset Generator</title>
    <style>
        body { 
            background: #111; color: #fff; font-family: -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; padding: 40px; margin: 0;
        }
        .header { text-align: center; margin-bottom: 30px;}
        .header h1 { font-size: 32px; margin: 0; color: #00f2fe; }
        
        /* Hiển thị nền ảnh dự án đằng sau Canvas để Sếp dễ mường tượng lỗ thủng */
        canvas { 
            border: 4px solid #333; 
            background: url('album/IMG_4140.JPG') center/cover; /* Demo preview */
            max-height: 60vh; 
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .controls { 
            display: flex; gap: 15px; margin-bottom: 30px; 
            background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px;
        }
        input { 
            padding: 15px; font-size: 18px; border-radius: 10px; border: none; 
            outline: none; font-weight: bold; width: 300px; text-transform: uppercase;
        }
        button { 
            padding: 15px 30px; font-size: 16px; background: #fe2c55; /* Màu Tiktok */
            color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #ff4c70; transform: translateY(-2px);}
        .btn-green { background: #25f4ee; color: #000;}
        .btn-green:hover { background: #45fffa; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Công Cụ Tạo Tài Nguyên Cho Effect House</h1>
        <p>Phần mềm đục lỗ mặt nạ chữ trong suốt (Độ phân giải chuẩn Tiktok 1080x1920)</p>
    </div>
    
    <div class="controls">
        <input type="text" id="textInput" value="OMWATER" placeholder="Nhập chữ muốn đục lỗ...">
        <button onclick="draw()">Cập Nhật Preview</button>
        <button class="btn-green" onclick="downloadPNG()">Tải File PNG Để Import Effect House</button>
    </div>
    
    <!-- Canvas ảo độ phân giải 1080x1920 (ẩn tỷ lệ thật, chỉ hiển thị thu nhỏ trên web) -->
    <canvas id="canvas" width="1080" height="1920"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function draw() {
            const text = document.getElementById('textInput').value.toUpperCase();
            
            // 1. Xóa toàn bộ khung vẽ
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 2. Đổ mực Đen Tuyển lên toàn bộ khung (Che lấp camera)
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#000000'; // Đen 100%
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 3. Kỹ thuật Kéo Thủng (Destination-out)
            // Bất cứ thứ gì vẽ bằng mode này sẽ "khoét một lỗ" làm trong suốt ảnh nền đen
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = '#ffffff'; 
            ctx.font = '900 280px "Arial Black", Impact, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Tự động ngắt dòng nếu có dấu cách
            const words = text.split(' ');
            let yOffset = canvas.height / 2 - ((words.length - 1) * 150);
            
            words.forEach(word => {
                ctx.fillText(word, canvas.width / 2, yOffset);
                yOffset += 300; // Khoảng cách giữa các dòng
            });
            
            // Reset mode
            ctx.globalCompositeOperation = 'source-over';
        }
        
        function downloadPNG() {
            // Tải ảnh Canvas định dạng PNG (Có kênh Alpha trong suốt ở chỗ chữ bị đục)
            const link = document.createElement('a');
            link.download = 'Tiktok_Mask_Asset.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Chạy lần đầu khi mở web
        window.onload = draw;
    </script>

<!-- 🔒 WT3D ENCRYPTED SHA-256 PIN GATE OVERLAY -->

      <form id="pin-form" onsubmit="verifyPin(event)" style="width:100%; display:flex; flex-direction:column; gap:0.9rem;">
        <input type="password" id="pin-input" maxlength="10" placeholder="••••" autocomplete="current-password" autofocus style="width:100%; padding:0.9rem; background:#09090B; border:2px solid #3F3F46; border-radius:14px; color:#FFF; font-size:1.6rem; text-align:center; letter-spacing:0.4em; outline:none; font-family:'JetBrains Mono',monospace; transition:all 0.2s;" onfocus="this.style.borderColor='#10B981'" onblur="this.style.borderColor='#3F3F46'">

        <button type="submit" style="width:100%; padding:0.9rem; background:linear-gradient(135deg, #10B981, #059669); border:none; border-radius:14px; color:#FFF; font-size:0.95rem; font-weight:800; cursor:pointer; box-shadow:0 4px 16px rgba(16,185,129,0.35); transition:transform 0.1s;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">MỞ KHÓA TRUY CẬP</button>
      </form>
      <div style="font-size:0.72rem; color:#71717A;">Bản quyền © WaterTreatment3D | Phan Trọng Tấn</div>

      <script id="wt3d-sha256-auth-script">
    const _WT3D_HASH = "748beb64b07dca157b83bbeb90e1abd407dba3ad959ff072de7ad0f6192e2b7b";
    function _wt3dSha256(ascii) {
      function r(v, a) { return (v >>> a) | (v << (32 - a)); }
      var m = Math.pow, mw = m(2, 32), lp = 'length', i, j, res = '',
          w = [], abl = ascii[lp] * 8, h = [], k = [], pc = 0, ic = {};
      for (var c = 2; pc < 64; c++) {
        if (!ic[c]) {
          for (i = 0; i < 313; i += c) ic[i] = c;
          h[pc] = (m(c, .5) * mw) | 0;
          k[pc++] = (m(c, 1 / 3) * mw) | 0;
        }
      }
      ascii += '\x80';
      while (ascii[lp] % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lp]; i++) {
        j = ascii.charCodeAt(i);
        w[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      w[w[lp]] = ((abl / mw) | 0);
      w[w[lp]] = (abl);
      for (j = 0; j < w[lp];) {
        var ws = w.slice(j, j += 16), oh = h.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var w15 = ws[i - 15], w2 = ws[i - 2], a = h[0], e = h[4],
              t1 = h[7] + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & h[5]) ^ ((~e) & h[6])) + k[i] +
              (ws[i] = (i < 16) ? ws[i] : (ws[i - 16] + (r(w15, 7) ^ r(w15, 18) ^ (w15 >>> 3)) + ws[i - 7] + (r(w2, 17) ^ r(w2, 19) ^ (w2 >>> 10))) | 0),
              t2 = (r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
          h = [(t1 + t2) | 0].concat(h);
          h[4] = (h[4] + t1) | 0;
          h.pop();
        }
        for (i = 0; i < 8; i++) h[i] = (h[i] + oh[i]) | 0;
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          var b = (h[i] >> (j * 8)) & 255;
          res += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return res;
    }
    function _verifyPinHash(pin) {
      return _wt3dSha256("WT3D_SALT_v2_" + String(pin).trim() + "_TANPHAN") === _WT3D_HASH;
    }
    function checkAuth() {
      const gate = document.getElementById("wt3d-pin-gate");
      if (localStorage.getItem("wt3d_vault_sha256") === _WT3D_HASH || sessionStorage.getItem("wt3d_vault_sha256") === _WT3D_HASH) {
        if (gate) gate.style.display = "none";
      } else {
        if (gate) gate.style.display = "flex";
      }
    }
    function verifyPin(e) {
      if (e) e.preventDefault();
      const inp = document.getElementById("pin-input");
      const pin = inp ? inp.value.trim() : "";
      const err = document.getElementById("pin-error");
      if (_verifyPinHash(pin)) {
        localStorage.setItem("wt3d_vault_sha256", _WT3D_HASH);
        sessionStorage.setItem("wt3d_vault_sha256", _WT3D_HASH);
        const gate = document.getElementById("wt3d-pin-gate");
        if (gate) {
          gate.style.transition = "opacity 0.25s ease";
          gate.style.opacity = "0";
          setTimeout(() => gate.style.display = "none", 250);
        }
      } else {
        if (err) err.style.display = "block";
        if (inp) {
          inp.style.borderColor = "#EF4444";
          inp.value = "";
          inp.focus();
        }
      }
    }
    function lockStudio() {
      localStorage.removeItem("wt3d_vault_sha256");
      sessionStorage.removeItem("wt3d_vault_sha256");
      localStorage.removeItem("wt3d_auth_2026");
      localStorage.removeItem("wt3d_pin_auth");
      location.reload();
    }
    checkAuth();
  </script>
