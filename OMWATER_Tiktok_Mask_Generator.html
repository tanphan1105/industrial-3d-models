<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>OMWATER - Tiktok Mask Asset Generator</title>
    <style>
        body { 
            background: #111; color: #fff; font-family: -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; padding: 40px; margin: 0;
        }
        .header { text-align: center; margin-bottom: 30px;}
        .header h1 { font-size: 32px; margin: 0; color: #00f2fe; }
        
        /* Hiển thị nền ảnh dự án đằng sau Canvas để Sếp dễ mường tượng lỗ thủng */
        canvas { 
            border: 4px solid #333; 
            background: url('album/IMG_4140.JPG') center/cover; /* Demo preview */
            max-height: 60vh; 
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        .controls { 
            display: flex; gap: 15px; margin-bottom: 30px; 
            background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px;
        }
        input { 
            padding: 15px; font-size: 18px; border-radius: 10px; border: none; 
            outline: none; font-weight: bold; width: 300px; text-transform: uppercase;
        }
        button { 
            padding: 15px 30px; font-size: 16px; background: #fe2c55; /* Màu Tiktok */
            color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #ff4c70; transform: translateY(-2px);}
        .btn-green { background: #25f4ee; color: #000;}
        .btn-green:hover { background: #45fffa; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Công Cụ Tạo Tài Nguyên Cho Effect House</h1>
        <p>Phần mềm đục lỗ mặt nạ chữ trong suốt (Độ phân giải chuẩn Tiktok 1080x1920)</p>
    </div>
    
    <div class="controls">
        <input type="text" id="textInput" value="OMWATER" placeholder="Nhập chữ muốn đục lỗ...">
        <button onclick="draw()">Cập Nhật Preview</button>
        <button class="btn-green" onclick="downloadPNG()">Tải File PNG Để Import Effect House</button>
    </div>
    
    <!-- Canvas ảo độ phân giải 1080x1920 (ẩn tỷ lệ thật, chỉ hiển thị thu nhỏ trên web) -->
    <canvas id="canvas" width="1080" height="1920"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function draw() {
            const text = document.getElementById('textInput').value.toUpperCase();
            
            // 1. Xóa toàn bộ khung vẽ
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 2. Đổ mực Đen Tuyển lên toàn bộ khung (Che lấp camera)
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#000000'; // Đen 100%
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 3. Kỹ thuật Kéo Thủng (Destination-out)
            // Bất cứ thứ gì vẽ bằng mode này sẽ "khoét một lỗ" làm trong suốt ảnh nền đen
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = '#ffffff'; 
            ctx.font = '900 280px "Arial Black", Impact, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Tự động ngắt dòng nếu có dấu cách
            const words = text.split(' ');
            let yOffset = canvas.height / 2 - ((words.length - 1) * 150);
            
            words.forEach(word => {
                ctx.fillText(word, canvas.width / 2, yOffset);
                yOffset += 300; // Khoảng cách giữa các dòng
            });
            
            // Reset mode
            ctx.globalCompositeOperation = 'source-over';
        }
        
        function downloadPNG() {
            // Tải ảnh Canvas định dạng PNG (Có kênh Alpha trong suốt ở chỗ chữ bị đục)
            const link = document.createElement('a');
            link.download = 'Tiktok_Mask_Asset.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Chạy lần đầu khi mở web
        window.onload = draw;
    </script>
</body>
</html>
