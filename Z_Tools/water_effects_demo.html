<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMWATER - Water Interactive Effects</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --water-dark: #0f172a;
            --water-deep: #0284c7;
            --water-light: #38bdf8;
            --water-glow: #7dd3fc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, var(--water-dark) 0%, #0c4a6e 100%);
            color: white;
            overflow-x: hidden;
            height: 100vh;
            position: relative;
        }

        /* =========================================
           EFFECT 1: Rising Bubbles (Canvas Background)
           ========================================= */
        #bubble-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* =========================================
           EFFECT 2: SVG Animated Ocean Waves
           ========================================= */
        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            overflow: hidden;
            line-height: 0;
            z-index: 2;
        }
        .wave-container svg {
            position: relative;
            display: block;
            width: calc(100% + 1.3px);
            height: 150px;
        }
        .wave-parallax > use {
            animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite;
        }
        .wave-parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
        .wave-parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
        .wave-parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
        .wave-parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }
        
        @keyframes move-forever {
            0% { transform: translate3d(-90px, 0, 0); }
            100% { transform: translate3d(85px, 0, 0); }
        }

        /* =========================================
           EFFECT 3: Glassmorphism Water Tank (UI)
           ========================================= */
        .content {
            position: relative;
            z-index: 3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .water-tank-card {
            background: rgba(56, 189, 248, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 0 20px rgba(56, 189, 248, 0.2);
            max-width: 600px;
            position: relative;
            overflow: hidden;
        }
        .water-tank-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            color: white;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px var(--water-glow);
        }

        /* =========================================
           EFFECT 4: Liquid Fill Button
           ========================================= */
        .liquid-btn {
            position: relative;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--water-light);
            background: transparent;
            border: 2px solid var(--water-light);
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            transition: color 0.4s ease;
            margin-top: 2rem;
            text-transform: uppercase;
            outline: none;
        }
        .liquid-btn span {
            position: relative;
            z-index: 2;
        }
        .liquid-btn .wave {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 200%;
            height: 200%;
            background: var(--water-light);
            border-radius: 40%;
            z-index: 1;
            transition: bottom 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            animation: rotateWave 4s linear infinite;
        }
        .liquid-btn:hover {
            color: #0f172a;
        }
        .liquid-btn:hover .wave {
            bottom: -20%;
        }
        @keyframes rotateWave {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* =========================================
           EFFECT 5: Mouse Click Ripple (Surface Drop)
           ========================================= */
        .ripple {
            position: absolute;
            border: 2px solid var(--water-light);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 1;
            pointer-events: none;
            animation: rippleAnim 1s ease-out forwards;
            z-index: 9999;
        }
        @keyframes rippleAnim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 4px; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; border-width: 0px; }
        }

    </style>
</head>
<body>

    <!-- Effect 1: Rising Bubbles -->
    <canvas id="bubble-canvas"></canvas>

    <div class="content">
        <!-- Effect 3: Glassmorphism Acrylic Tank -->
        <div class="water-tank-card">
            <h1>PURE RO TECHNOLOGY</h1>
            <p style="color: #cbd5e1; line-height: 1.6;">
                Click bất kỳ đâu trên màn hình để tạo hiệu ứng giọt nước lan tỏa (Ripple). Rê chuột vào nút bên dưới để xem hiệu ứng nước dâng trào (Liquid Fill).
            </p>
            
            <!-- Effect 4: Liquid Fill Button -->
            <button class="liquid-btn">
                <span>Khởi Động Bơm</span>
                <div class="wave"></div>
            </button>
        </div>
    </div>

    <!-- Effect 2: SVG Animated Ocean Waves -->
    <div class="wave-container">
        <svg viewBox="0 24 150 28" preserveAspectRatio="none">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="wave-parallax">
                <!-- Layer sóng 1 -->
                <use href="#gentle-wave" x="48" y="0" fill="rgba(56, 189, 248, 0.1)" />
                <!-- Layer sóng 2 -->
                <use href="#gentle-wave" x="48" y="3" fill="rgba(56, 189, 248, 0.2)" />
                <!-- Layer sóng 3 -->
                <use href="#gentle-wave" x="48" y="5" fill="rgba(56, 189, 248, 0.3)" />
                <!-- Layer sóng 4 (Trền cùng) -->
                <use href="#gentle-wave" x="48" y="7" fill="rgba(56, 189, 248, 0.5)" />
            </g>
        </svg>
    </div>

    <script>
        // =========================================
        // EFFECT 1: Rising Bubbles Animation
        // =========================================
        const canvas = document.getElementById('bubble-canvas');
        const ctx = canvas.getContext('2d');

        let bubbles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Bubble {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; // Phân bổ ban đầu
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50; // Xuất phát từ đáy
                this.size = Math.random() * 6 + 2; // Kích thước từ 2px đến 8px
                this.speed = Math.random() * 2 + 0.5; // Tốc độ nổi
                this.opacity = Math.random() * 0.5 + 0.1;
                this.wobbleSpeed = Math.random() * 0.05 + 0.02;
                this.wobbleDistance = Math.random() * 2 + 1;
                this.wobbleAngle = Math.random() * Math.PI * 2;
            }

            update() {
                this.y -= this.speed;
                // Lắc lư nhẹ sang 2 bên
                this.wobbleAngle += this.wobbleSpeed;
                this.x += Math.sin(this.wobbleAngle) * this.wobbleDistance;

                if (this.y < -50) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(125, 211, 252, ${this.opacity})`; // Màu xanh nước rực rỡ
                ctx.fill();
                
                // Highlight cho bọt khí (như có ánh sáng chiếu vào)
                ctx.beginPath();
                ctx.arc(this.x - this.size*0.3, this.y - this.size*0.3, this.size*0.2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity + 0.3})`;
                ctx.fill();
            }
        }

        // Tạo 80 bọt khí
        for (let i = 0; i < 80; i++) {
            bubbles.push(new Bubble());
        }

        function animateBubbles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            bubbles.forEach(b => {
                b.update();
                b.draw();
            });
            requestAnimationFrame(animateBubbles);
        }
        animateBubbles();

        // =========================================
        // EFFECT 5: Mouse Click Ripple (Giọt nước rơi)
        // =========================================
        document.addEventListener('click', function(e) {
            // Không tạo ripple nếu click vào nút (nút đã có hiệu ứng riêng)
            if (e.target.closest('.liquid-btn')) return;

            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            
            // Kích thước ngẫu nhiên cho gợn sóng
            const size = Math.random() * 100 + 100; // 100px - 200px
            ripple.style.width = size + 'px';
            ripple.style.height = size + 'px';

            document.body.appendChild(ripple);

            // Xóa phần tử DOM sau khi animation kết thúc (1s)
            setTimeout(() => {
                ripple.remove();
            }, 1000);
        });

    </script>
</body>
</html>
