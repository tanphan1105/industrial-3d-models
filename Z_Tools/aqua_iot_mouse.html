<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUA·IOT — Mouse Interactive WebGL</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020810;--panel:#030c18;--border:#0a2038;
  --accent:#00d4ff;--green:#00ff9d;--amber:#ffaa00;
  --text:#6ab0cc;--dim:#1e4a66;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Share Tech Mono',monospace;color:var(--text);min-height:100vh;}
header{
  text-align:center;padding:1.8rem 1rem 1.2rem;
  border-bottom:1px solid var(--border);
  background:radial-gradient(ellipse 70% 120% at 50% -10%,#001a3328 0%,transparent 70%);
}
.logo{
  font-family:'Orbitron',sans-serif;font-size:clamp(1.6rem,3.5vw,2.8rem);
  font-weight:900;letter-spacing:.3em;
  background:linear-gradient(100deg,#00d4ff 0%,#00ff9d 50%,#00d4ff 100%);
  background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:sh 4s linear infinite;
}
@keyframes sh{to{background-position:200% 0;}}
.sub{font-size:.68rem;letter-spacing:.18em;color:var(--dim);margin-top:.3rem;}
.hint{font-size:.6rem;letter-spacing:.12em;color:#0d3350;margin-top:.25rem;}
.hint span{color:#1a5570;}

.grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:var(--border);
  border:1px solid var(--border);margin:.8rem;border-radius:4px;overflow:hidden;
}
.cell{background:var(--panel);position:relative;aspect-ratio:1;overflow:hidden;cursor:crosshair;}
.cell canvas{width:100%;height:100%;display:block;}
.cell:hover .hover-ring{opacity:1;}
.hover-ring{
  position:absolute;inset:0;pointer-events:none;
  border:1px solid #00d4ff22;opacity:0;transition:opacity .2s;z-index:3;
}
.lbl{
  position:absolute;bottom:0;left:0;right:0;
  padding:3px 7px;font-size:.55rem;letter-spacing:.08em;
  color:var(--dim);background:linear-gradient(transparent,#020810dd);
  z-index:2;text-transform:uppercase;
}
.num{
  position:absolute;top:5px;left:7px;font-size:.5rem;
  color:#0d2a3c;z-index:2;font-family:'Orbitron',sans-serif;
}
.mouse-tag{
  position:absolute;top:5px;right:7px;font-size:.45rem;
  color:#0d3a50;z-index:2;letter-spacing:.05em;
}
footer{
  text-align:center;padding:.8rem;font-size:.55rem;
  letter-spacing:.12em;color:var(--dim);border-top:1px solid var(--border);
}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<header>
  <div class="logo">AQUA · IOT</div>
  <div class="sub">20 WEBGL EFFECTS — MOUSE INTERACTIVE // GLSL FRAGMENT SHADERS</div>
  <div class="hint">Di chuột vào từng ô để kích hoạt hiệu ứng · <span>Move cursor over each panel</span></div>
</header>

<div class="grid" id="grid"></div>
<footer>WEBGL 1.0 · GLSL ES 1.0 · u_mouse VEC2 PER CANVAS · REAL-TIME</footer>

<script>
// Vertex shader shared
const VS=`attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0,1);}`;

// ─────────────────────────────────────────────────────────────────────────────
// EFFECT DEFINITIONS  (u_mouse = normalized 0..1, u_res, u_t)
// ─────────────────────────────────────────────────────────────────────────────

const EFFECTS = [

// ── 01 · RIPPLE FROM CURSOR ───────────────────────────────────────────────────
{name:"Ripple Source", hint:"cursor=epicenter",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  float d=length(uv-m);
  float wave=0.;
  for(int i=0;i<10;i++){
    float fi=float(i);
    float r=mod(u_t*0.8-fi*0.35,4.)*0.27;
    float fade=1.-mod(u_t*0.8-fi*0.35,4.)/4.;
    wave+=smoothstep(0.018,0.,abs(d-r))*fade*fade;
  }
  vec2 norm=uv-m; float ang=atan(norm.y,norm.x);
  float shim=sin(ang*6.+u_t*2.)*0.5+0.5;
  vec3 c=vec3(0.01,0.05,0.18)+wave*mix(vec3(0.,0.6,1.),vec3(0.3,1.,1.),shim);
  c+=smoothstep(0.04,0.,d)*vec3(0.,0.5,1.)*0.6;
  gl_FragColor=vec4(c,1.);
}`},

// ── 02 · OCEAN DISTURBED BY CURSOR ───────────────────────────────────────────
{name:"Ocean Disturbance", hint:"cursor=wave source",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float w(vec2 p,float f,float a,float s,float ph){return a*sin(dot(p,vec2(cos(ph),sin(ph)))*f+u_t*s);}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  // distort uv near cursor
  float dist=length(uv-m);
  float pull=0.12*exp(-dist*dist*4.)*sin(dist*15.-u_t*5.);
  vec2 puv=uv+(uv-m)*pull/max(dist,.01)*0.1;
  float h=w(puv,4.,.08,1.1,.3)+w(puv,7.,.05,1.7,1.1)+w(puv,14.,.03,2.2,2.3)+w(puv,25.,.015,3.5,.9);
  // extra waves from mouse
  float mwave=.06*sin(dist*18.-u_t*4.)*exp(-dist*2.);
  h+=mwave;
  vec3 c=mix(vec3(.01,.05,.18),vec3(0.,.3,.7),clamp(h*4.+.5,0.,1.));
  c=mix(c,vec3(.5,.9,1.),smoothstep(.12,.18,h));
  c+=smoothstep(.06,0.,dist)*vec3(0.,.4,.8)*.5;
  gl_FragColor=vec4(c,1.);
}`},

// ── 03 · VORTEX FOLLOWS CURSOR ────────────────────────────────────────────────
{name:"Vortex Drain", hint:"cursor=drain center",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  vec2 p=uv-m;
  float r=length(p);
  float a=atan(p.y,p.x);
  float spin=-u_t*2./max(r,.04);
  float sw=sin(a*6.+spin+r*10.-u_t*3.)*.5+.5;
  float depth=1.-smoothstep(0.,.9,r);
  vec3 c=mix(vec3(0.,.02,.08),mix(vec3(0.,.2,.5),vec3(.4,.85,1.),sw*depth),depth);
  c+=exp(-r*r*3.)*.8*vec3(0.,.4,.9);
  c*=1.-exp(-r*5.);
  c+=smoothstep(.03,0.,r)*vec3(.8,1.,1.)*.7;
  gl_FragColor=vec4(c,1.);
}`},

// ── 04 · FLUID GRID DEFORMS UNDER CURSOR ─────────────────────────────────────
{name:"Fluid Grid", hint:"cursor=deform field",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  vec2 diff=uv-m;
  float dist=length(diff);
  // repulsion deform
  float push=.3*exp(-dist*dist*3.);
  vec2 duv=(uv+diff*push/(dist+.001))*8.;
  duv+=vec2(sin(uv.y*2.+u_t*.7),cos(uv.x*2.+u_t*.9))*.25;
  vec2 gf=fract(duv);
  float gx=smoothstep(.05,0.,gf.x)+smoothstep(.95,1.,gf.x);
  float gy=smoothstep(.05,0.,gf.y)+smoothstep(.95,1.,gf.y);
  float grid=max(gx,gy);
  vec3 c=vec3(0.,.12,.35)*.4;
  c+=grid*mix(vec3(0.,.4,.85),vec3(0.,1.,.7),push*3.);
  c+=smoothstep(.06,0.,dist)*vec3(0.,.6,1.)*.5;
  c+=smoothstep(.02,0.,dist)*vec3(1.,1.,1.)*.8;
  gl_FragColor=vec4(c,1.);
}`},

// ── 05 · SONAR PINGS FROM CURSOR ─────────────────────────────────────────────
{name:"Sonar Ping", hint:"cursor=ping origin",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float hash(float n){return fract(sin(n)*43758.5);}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  vec3 c=vec3(0.,.06,.03);
  float gx=abs(sin(uv.x*8.)*.03); float gy=abs(sin(uv.y*8.)*.03);
  c+=vec3(0.,.06,.03)*step(.97,gx+gy);
  for(int i=0;i<6;i++){
    float ph=mod(u_t*.9-float(i)*.4,4.);
    float fade=(1.-ph/4.)*exp(-ph*.4);
    float r=ph*.32;
    c+=smoothstep(.015,0.,abs(length(uv-m)-r))*fade*vec3(0.,1.,.4)*1.8;
  }
  // blips at fixed positions
  for(int i=0;i<8;i++){
    float id=float(i);
    vec2 pos=vec2(hash(id)-.5,hash(id+1.)-.5)*1.6;
    float d=length(uv-pos);
    float blink=sin(u_t*2.5+id*2.)*.5+.5;
    // brighter if near mouse
    float near=exp(-length(m-pos)*3.);
    c+=blink*smoothstep(.04,0.,d)*vec3(0.,1.,.3)*(0.7+near*.8);
  }
  c+=smoothstep(.04,0.,length(uv-m))*vec3(0.,1.,.5);
  gl_FragColor=vec4(c,1.);
}`},

// ── 06 · BUBBLES FLEE CURSOR ──────────────────────────────────────────────────
{name:"Bubble Swarm", hint:"cursor=repels bubbles",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float hash(float n){return fract(sin(n)*43758.5);}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  vec3 c=vec3(0.,.02,.08);
  for(int i=0;i<28;i++){
    float id=float(i);
    float r=hash(id)*.07+.02;
    float spd=hash(id+1.)*.4+.2;
    float base_x=(hash(id+3.)-.5)*1.7;
    float cy=mod(-1.+hash(id+4.)+u_t*spd,2.)-1.;
    float cx=base_x+sin(u_t*hash(id+5.)*2.+id)*.12;
    // flee from mouse
    vec2 bpos=vec2(cx,cy);
    vec2 toMouse=bpos-m;
    float md=length(toMouse);
    float repel=.18*exp(-md*md*4.);
    bpos+=normalize(toMouse+vec2(.001))*repel;
    float d=length(uv-bpos);
    float bubble=smoothstep(r,r-.01,d)-smoothstep(r-.01,r-.025,d);
    float inn=smoothstep(r,0.,d)*.12;
    float shine=smoothstep(.012,0.,length(uv-bpos-vec2(r*.3,r*.4)));
    c+=bubble*vec3(.15,.65,.95)*.9;
    c+=inn*vec3(0.,.15,.45);
    c+=shine*vec3(1.,1.,1.)*.95;
  }
  c+=smoothstep(.08,0.,length(uv-m))*vec3(0.,.4,.7)*.3;
  gl_FragColor=vec4(c,1.);
}`},

// ── 07 · CAUSTICS FOCUSED BY CURSOR ──────────────────────────────────────────
{name:"Caustic Focus", hint:"cursor=light focus",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
vec2 hash2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5);}
float voro(vec2 p,vec2 off){
  vec2 i=floor(p);vec2 f=fract(p);float d=8.;
  for(int y=-2;y<=2;y++)for(int x=-2;x<=2;x++){
    vec2 g=vec2(float(x),float(y));
    vec2 o=hash2(i+g);
    o=.5+.5*sin(u_t*.6+6.28*o);
    d=min(d,length(g+o-f));
  }
  return d;
}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 m=u_mouse;
  // shift caustic toward mouse
  vec2 p=uv*6.+m*2.;
  float v=voro(p,vec2(0.));
  float v2=voro(p*1.4+vec2(1.3,.9),vec2(0.));
  float cc=pow(1.-v,4.)*pow(1.-v2,3.);
  // brightness falloff from mouse
  float dist=length(uv-m);
  float boost=1.+2.*exp(-dist*dist*6.);
  vec3 col=vec3(0.,.04,.14)+cc*vec3(0.,.55,.95)*2.*boost;
  col+=pow(cc,3.)*vec3(.4,.9,1.)*3.*boost;
  col+=smoothstep(.06,0.,dist)*vec3(0.,.3,.6)*.4;
  gl_FragColor=vec4(col,1.);
}`},

// ── 08 · PRESSURE WAVE FROM CURSOR ───────────────────────────────────────────
{name:"Pressure Wave", hint:"cursor=blast center",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  float d=length(uv-m);
  float w1=sin(d*14.-u_t*4.)*exp(-d*1.8);
  float w2=sin(d*22.-u_t*6.+1.)*exp(-d*2.5)*.5;
  float w=w1+w2;
  vec3 lo=vec3(0.,.04,.2),hi=vec3(0.,.6,1.),pk=vec3(.5,1.,1.);
  vec3 c=mix(lo,hi,clamp(w*.5+.5,0.,1.));
  c=mix(c,pk,clamp(w-.5,0.,1.)*2.);
  c+=fract(d*6.-u_t*.5)*.25*vec3(0.,.08,.25)*.5;
  c*=1.-smoothstep(.9,1.1,d);
  c+=smoothstep(.04,0.,d)*vec3(0.,.7,1.)*.8;
  gl_FragColor=vec4(c,1.);
}`},

// ── 09 · IOT NETWORK — NODE NEAREST CURSOR ACTIVATES ─────────────────────────
{name:"IoT Network", hint:"cursor=activates nodes",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float hash(float n){return fract(sin(n)*43758.5);}
vec2 node(float i){return vec2(hash(i)-.5,hash(i+1.)-.5)*1.6;}
float seg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  vec3 c=vec3(.01,.03,.08);
  float N=9.;
  for(float i=0.;i<N;i++){
    for(float j=i+1.;j<N;j++){
      vec2 a=node(i),b=node(j);
      // only draw edges near mouse's closest node
      float da=length(m-a),db=length(m-b);
      float act=exp(-min(da,db)*2.5);
      float flow=sin(u_t*1.5+i*.7+j*1.1)*.5+.5;
      float line=smoothstep(.018,0.,seg(uv,a,b))*mix(.15,1.,act)*flow*.5;
      float pkt_t=mod(u_t*.7+i*.4+j*.6,2.)-.5;
      vec2 pkt=mix(a,b,clamp(pkt_t,0.,1.));
      float pk=smoothstep(.04,0.,length(uv-pkt))*step(0.,pkt_t)*step(pkt_t,1.)*act;
      c+=line*vec3(0.,.45,.9);
      c+=pk*vec3(0.,1.,.8)*.9;
    }
  }
  for(float i=0.;i<N;i++){
    vec2 n=node(i);
    float near=exp(-length(m-n)*3.5);
    float pulse=sin(u_t*2.+i)*.5+.5;
    c+=smoothstep(.06,0.,length(uv-n))*vec3(0.,.65,1.)*(pulse+near);
    c+=smoothstep(.025,0.,length(uv-n))*vec3(.4,1.,1.)*.8;
  }
  gl_FragColor=vec4(c,1.);
}`},

// ── 10 · TURBULENCE PULLED TOWARD CURSOR ─────────────────────────────────────
{name:"Turbulence Flow", hint:"cursor=attractor",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
vec2 hash2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return -1.+2.*fract(sin(p)*43758.5);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);return mix(mix(dot(hash2(i),f),dot(hash2(i+vec2(1,0)),f-vec2(1,0)),u.x),mix(dot(hash2(i+vec2(0,1)),f-vec2(0,1)),dot(hash2(i+vec2(1,1)),f-vec2(1,1)),u.x),u.y);}
vec2 curl(vec2 p){float e=.01;return vec2((noise(p+vec2(e,0.))-noise(p-vec2(e,0.)))/(2.*e),-(noise(p+vec2(0.,e))-noise(p-vec2(0.,e)))/(2.*e));}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 m=u_mouse;
  vec2 p=uv*3.;
  // bias curl toward mouse
  vec2 pull=(m-uv)*0.8;
  vec2 cc=curl(p+u_t*.15)+pull;
  vec2 cc2=curl(p*2.+u_t*.25+cc*.5);
  float n=noise(p+cc+cc2*.5+u_t*.1)*.5+.5;
  float n2=noise(p*3.+cc2+u_t*.2)*.5+.5;
  float dist=length(uv-m);
  float glow=exp(-dist*dist*8.);
  vec3 col=mix(mix(vec3(0.,.18,.55),vec3(0.,.65,.95),n),vec3(.35,.95,.95),n2*n);
  col+=glow*vec3(0.,.5,1.)*.6;
  gl_FragColor=vec4(col,1.);
}`},

// ── 11 · WATER LEVEL — MOUSE Y CONTROLS HEIGHT ───────────────────────────────
{name:"Water Level Sensor", hint:"cursor Y=water level",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float noise(float x){return sin(x)*.3+sin(x*2.1+1.)*.2+sin(x*3.7+2.)*.1;}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  float target=u_mouse.y;
  float lvl=mix(.1,target,.9);
  float surface=lvl+noise(uv.x*9.+u_t*2.)*.012;
  float water=step(uv.y,surface);
  vec3 c=vec3(.02,.06,.12);
  float depth=uv.y/max(surface,.001);
  vec3 wc=mix(vec3(0.,.12,.38),vec3(0.,.48,.88),depth);
  float cst=sin(uv.x*22.+u_t)*sin(uv.y*18.+u_t*1.3)*.5+.5;
  wc+=cst*.04*vec3(0.,.35,.55);
  c=mix(c,wc,water);
  // foam
  c+=smoothstep(.01,0.,abs(uv.y-surface))*vec3(.4,.85,.95)*water;
  // walls + bottom
  float wall=smoothstep(.04,.03,uv.x)+smoothstep(.96,.97,uv.x)+smoothstep(.04,.03,uv.y);
  c+=wall*vec3(.05,.18,.25)*.9;
  // level line + percentage
  float mark=smoothstep(.003,0.,abs(uv.y-lvl))*step(.88,uv.x);
  c+=mark*vec3(1.,.6,0.);
  // mouse cursor line
  float cursorLine=smoothstep(.002,0.,abs(uv.y-u_mouse.y))*step(uv.x,.12);
  c+=cursorLine*vec3(0.,1.,.5)*.7;
  gl_FragColor=vec4(c,1.);
}`},

// ── 12 · SURFACE TENSION — MOUSE IS EXTRA BLOB ───────────────────────────────
{name:"Surface Tension", hint:"cursor=extra blob",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float blob(vec2 p,vec2 c,float r){return r*r/max(dot(p-c,p-c),.0001);}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  float f=0.;
  float N=6.;
  for(float i=0.;i<N;i++){
    float a=i/N*6.283+u_t*.4;
    float r2=.32+.1*sin(u_t*.7+i);
    f+=blob(uv,vec2(cos(a)*r2,sin(a)*r2),.12);
  }
  f+=blob(uv,vec2(0.),.08);
  // mouse blob
  f+=blob(uv,m,.1);
  float surface=smoothstep(.95,1.05,f);
  float glow=smoothstep(.5,1.,f)*(1.-surface);
  vec3 c=vec3(.01,.04,.12);
  c+=glow*vec3(0.,.28,.65)*.6;
  c+=surface*vec3(0.,.55,.95);
  c+=smoothstep(1.05,1.5,f)*vec3(.08,.45,.85);
  c+=surface*(1.-smoothstep(1.05,1.5,f))*.8*vec3(.35,.85,1.)*.6;
  // cursor glow
  c+=smoothstep(.1,0.,length(uv-m))*vec3(0.,.6,1.)*.3;
  gl_FragColor=vec4(c,1.);
}`},

// ── 13 · BIOLUMINESCENCE ATTRACTED TO CURSOR ─────────────────────────────────
{name:"Bioluminescence", hint:"cursor=attracts particles",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float hash(float n){return fract(sin(n)*43758.5);}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  vec3 c=vec3(0.,.01,.04);
  for(int i=0;i<45;i++){
    float id=float(i);
    float spd=hash(id+.5)*.3+.05;
    float drift=sin(u_t*.3+id*1.7)*.12;
    float base_x=(hash(id)-.5)*1.8;
    float base_y=mod((hash(id+1.)-.5)*1.8+u_t*spd,2.)-1.;
    vec2 bpos=vec2(base_x+drift,base_y);
    // attract to mouse
    vec2 toM=m-bpos;
    float md=length(toM);
    bpos+=normalize(toM+vec2(.001))*(.2/(md+.3));
    float rr=hash(id+2.)*.04+.01;
    float pulse=sin(u_t*2.+id*1.3)*.4+.6;
    float d=length(uv-bpos);
    float glow=rr*rr/(d*d+.0001)*pulse;
    vec3 hue=vec3(hash(id*.3)*.2,0.7+hash(id*.5)*.3,0.8+hash(id*.7)*.2);
    c+=glow*.018*hue;
  }
  // mouse glow
  float mdist=length(uv-m);
  c+=exp(-mdist*mdist*8.)*vec3(0.,.4,.7)*.3;
  c=pow(c,vec3(.72));
  gl_FragColor=vec4(c,1.);
}`},

// ── 14 · RAIN BENDS TOWARD CURSOR ────────────────────────────────────────────
{name:"Rain Wind", hint:"cursor X=wind direction",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float hash(float n){return fract(sin(n)*43758.5);}
float drop(vec2 uv,float id,float wind){
  float x=hash(id)*2.-1.;
  float spd=hash(id+1.)*1.5+.8;
  float len=hash(id+2.)*.09+.02;
  float y=mod(uv.y+u_t*spd+hash(id+3.),2.2)-1.1;
  float wx=x+wind*(uv.y+1.)*0.35;
  float dist=smoothstep(.005,.0,abs(uv.x-wx));
  return dist*smoothstep(len,0.,abs(y))*smoothstep(-len,-len*.3,y);
}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  float wind=(u_mouse.x-.5)*1.2;
  float r=0.;
  for(int i=0;i<60;i++) r+=drop(uv,float(i)*3.7,wind);
  // splash near mouse
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y; m.y=-1.;
  for(int i=0;i<8;i++){
    float id=float(i);
    float a=id/8.*6.28+u_t*2.;
    float rr=mod(u_t*.8+id*.2,1.)*.3;
    float fade=1.-mod(u_t*.8+id*.2,1.);
    r+=smoothstep(.015,0.,abs(length(uv-(m+vec2(cos(a)*rr,sin(a)*rr*.3)))-.01))*fade*.5;
  }
  vec3 c=vec3(.01,.03,.09)+r*vec3(.25,.65,.95);
  float fog=exp(-abs(uv.y+.5)*2.)*.06;
  c+=vec3(0.,.08,.18)*fog;
  gl_FragColor=vec4(c,1.);
}`},

// ── 15 · FLOW METER — CURSOR X = FLOW RATE ───────────────────────────────────
{name:"Flow Rate Meter", hint:"cursor X=flow rate",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  float rate=u_mouse.x;
  vec3 c=vec3(.01,.04,.1);
  // pipe
  float py=abs(uv.y-.5);
  float pipe=smoothstep(.22,.2,py);
  c+=vec3(0.,.07,.18)*pipe;
  float bord=smoothstep(.22,.21,py)-smoothstep(.2,.19,py);
  c+=vec3(0.,.38,.65)*bord;
  // particles flow with speed = rate
  if(py<.2){
    float flow=0.;
    for(int i=0;i<35;i++){
      float id=float(i);
      float ox=hash(vec2(id,1.));
      float oy=(hash(vec2(id,2.))-.5)*.35;
      float spd=hash(vec2(id,3.))*.5+.3;
      float px=mod(ox+u_t*spd*rate*2.5,1.);
      vec2 pp=vec2(px,.5+oy);
      float d=length(uv-pp);
      flow+=.003/(.0001+d*d*80.);
    }
    c+=flow*mix(vec3(0.,.5,.8),vec3(0.,1.,.5),rate)*pipe;
  }
  // IoT gauge bar
  float bar=smoothstep(.02,0.,abs(uv.y-.1));
  c+=step(uv.x,rate)*bar*mix(vec3(0.,1.,.4),vec3(1.,.2,0.),rate);
  c+=smoothstep(.015,0.,length(uv-vec2(rate,.1)))*vec3(1.,1.,.5);
  // turbulence at high flow
  float turb=sin(uv.x*50.+u_t*8.*rate)*rate*.03*pipe;
  c+=turb*vec3(0.,.5,.8);
  gl_FragColor=vec4(c,1.);
}`},

// ── 16 · DATA STREAM DISRUPTED BY CURSOR ─────────────────────────────────────
{name:"Data Stream", hint:"cursor=disrupts stream",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float hash(float n){return fract(sin(n)*43758.5);}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 m=u_mouse;
  vec3 c=vec3(.01,.03,.08);
  float streams=8.;
  for(float i=0.;i<streams;i++){
    float xi=(i+.5)/streams;
    float bw=.015+hash(i)*.01;
    float dist=abs(uv.x-xi);
    if(dist<bw+.04){
      float spd=hash(i+1.)*.8+.4;
      // scatter near mouse column
      float mdx=abs(uv.x-m.x);
      float scatter=exp(-mdx*mdx*40.)*.08;
      float cy=floor(uv.y*30.);
      float cx=floor(uv.x*80.);
      float bit=step(.5,hash(cx*.1+cy*.3+i+floor(u_t*20.)*scatter));
      float scroll=step(0.,fract(uv.y-u_t*spd));
      float alpha=smoothstep(bw+.035,bw,dist);
      float head=mod(u_t*spd,1.);
      float trail=1.-smoothstep(0.,.35,mod(uv.y-head,1.));
      // hue shift near mouse
      float hshift=exp(-length(uv-m)*5.);
      vec3 hue=mix(mix(vec3(0.,.75,.95),vec3(0.,.95,.5),hash(i)),vec3(1.,.5,0.),hshift);
      c+=bit*scroll*alpha*trail*hue*.65;
      c+=smoothstep(.04,0.,abs(uv.y-head))*alpha*vec3(1.)*.9;
    }
  }
  // mouse glow disruption
  c+=exp(-length(uv-m)*length(uv-m)*30.)*vec3(.3,.7,1.)*.15;
  gl_FragColor=vec4(c,1.);
}`},

// ── 17 · DEPTH SONAR — SCAN LINE FOLLOWS CURSOR ──────────────────────────────
{name:"Depth Sonar", hint:"cursor Y=scan depth",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  float a=fract(sin(dot(i,vec2(127.1,311.7)))*43758.5);
  float b=fract(sin(dot(i+vec2(1,0),vec2(127.1,311.7)))*43758.5);
  float cc=fract(sin(dot(i+vec2(0,1),vec2(127.1,311.7)))*43758.5);
  float d=fract(sin(dot(i+vec2(1,1),vec2(127.1,311.7)))*43758.5);
  vec2 u=f*f*(3.-2.*f);
  return mix(mix(a,b,u.x),mix(cc,d,u.x),u.y);
}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  float h=noise(uv*2.+vec2(u_t*.04))*.5+noise(uv*4.)*.25+noise(uv*8.)*.125;
  float iso=abs(sin(h*22.))*.4;
  vec3 c=mix(mix(vec3(0.,.04,.18),vec3(0.,.28,.65),h),vec3(0.,.65,.95),smoothstep(.55,1.,h));
  c+=iso*vec3(0.,.15,.35)*.5;
  // scan line follows cursor Y
  float scanY=u_mouse.y*2.-1.;
  float scanline=smoothstep(.025,0.,abs(uv.y-scanY));
  c+=scanline*vec3(0.,1.,.5)*.7;
  // ping from cursor
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  for(int i=0;i<4;i++){
    float ph=mod(u_t*.6-float(i)*.5,3.5);
    float fade=1.-ph/3.5;
    c+=smoothstep(.02,0.,abs(length(uv-m)-ph*.3))*fade*vec3(0.,1.,.4)*.8;
  }
  gl_FragColor=vec4(c,1.);
}`},

// ── 18 · ION EXCHANGE — CURSOR IS A CHARGED ELECTRODE ────────────────────────
{name:"Ion Exchange", hint:"cursor=electrode charge",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float hash(float n){return fract(sin(n)*43758.5);}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  vec3 c=vec3(.01,.03,.09);
  for(int i=0;i<22;i++){
    float id=float(i);
    float sgn=hash(id+9.)>.5?1.:-1.;
    float ang=hash(id)*6.28+u_t*(hash(id+2.)*2.-1.)*.5;
    float rr=hash(id+6.)*.8+.1;
    vec2 pos=vec2(cos(ang)*rr,sin(ang)*rr);
    // attract/repel from cursor (opposite charge attracts)
    vec2 toM=m-pos;
    float md=length(toM);
    pos+=normalize(toM)*sgn*.15/(md+.3);
    float d=length(uv-pos);
    vec3 pc=sgn>0.?vec3(0.,.6,1.):vec3(1.,.15,.1);
    c+=.0035/(d*d+.0001)*pc;
    c+=smoothstep(.04,0.,d)*pc*.8;
  }
  // cursor electrode glow
  float mdist=length(uv-m);
  c+=exp(-mdist*mdist*8.)*vec3(.8,.4,1.)*.4;
  c+=smoothstep(.04,0.,mdist)*vec3(1.,.6,1.)*1.2;
  // membrane
  c+=smoothstep(.005,0.,abs(uv.x))*vec3(.2,.6,.2)*.35;
  gl_FragColor=vec4(c,1.);
}`},

// ── 19 · PIPELINE — CURSOR X = VALVE, Y = PRESSURE ───────────────────────────
{name:"Pipeline Control", hint:"X=valve / Y=pressure",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float hash(float n){return fract(sin(n)*43758.5);}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  float valve=u_mouse.x;
  float pres=u_mouse.y;
  vec3 c=vec3(.02,.05,.1);
  float pipes[3];pipes[0]=.25;pipes[1]=.5;pipes[2]=.75;
  for(int p=0;p<3;p++){
    float py=pipes[p];
    float pr=.055+float(p)*.012;
    float dy=abs(uv.y-py);
    float inside=smoothstep(pr,pr-.006,dy);
    float wall=smoothstep(pr,pr-.006,dy)-smoothstep(pr-.006,pr-.022,dy);
    c+=inside*vec3(0.,.07,.18);
    c+=wall*vec3(.08,.22,.32);
    float spd=(valve+float(p)*.15)*pres*1.8;
    for(int i=0;i<25;i++){
      float id=float(i)+float(p)*100.;
      float px=mod(hash(id)+u_t*spd,1.);
      float oy=(hash(id+1.)-.5)*pr*1.4;
      vec2 pp=vec2(px,py+oy);
      float d=length(uv-pp);
      float glow=.0015/(.00001+d*d);
      c+=glow*mix(vec3(0.,.65,.95),vec3(.2,.95,.7),float(p)/2.)*inside*.6;
    }
    // turbulence at high pressure
    float turb=sin(uv.x*40.+u_t*6.*spd)*inside*pres*.035;
    c+=turb*vec3(0.,.3,.55);
  }
  // valve indicators (color = open/closed)
  for(int i=0;i<3;i++){
    float vx=.25+float(i)*.25;
    float vy=pipes[i];
    float vd=smoothstep(.03,0.,length(uv-vec2(vx,vy)));
    c+=vd*mix(vec3(1.,.1,0.),vec3(0.,1.,.4),valve);
  }
  gl_FragColor=vec4(c,1.);
}`},

// ── 20 · SENSOR STORM — CURSOR IS EYE OF STORM ───────────────────────────────
{name:"Sensor Storm", hint:"cursor=eye of storm",
frag:`precision mediump float;
uniform vec2 u_res,u_mouse;uniform float u_t;
float hash(float n){return fract(sin(n)*43758.5);}
void main(){
  vec2 uv=(gl_FragCoord.xy/u_res)*2.-1.; uv.x*=u_res.x/u_res.y;
  vec2 m=(u_mouse*2.-1.); m.x*=u_res.x/u_res.y;
  vec3 c=vec3(.01,.02,.06);
  for(int i=0;i<90;i++){
    float id=float(i);
    // orbit around mouse
    float baseAng=hash(id)*6.28;
    float angSpd=(hash(id+2.)*2.-1.)*1.5;
    float orbitR=hash(id+6.)*.8+.1;
    float ang=baseAng+u_t*angSpd;
    // spiral in from outer
    float rr=orbitR*(1.-.3*sin(u_t*.3+id));
    vec2 pos=m+vec2(cos(ang)*rr,sin(ang)*rr);
    float d=length(uv-pos);
    float sz=hash(id+3.)*.012+.003;
    float glow=sz*sz/(d*d+.00001);
    float type=floor(hash(id+7.)*4.);
    vec3 sc;
    if(type<1.) sc=vec3(0.,.8,1.);
    else if(type<2.) sc=vec3(1.,.5,0.);
    else if(type<3.) sc=vec3(.4,1.,.3);
    else sc=vec3(1.,.1,.4);
    c+=glow*sc*.022;
    c+=smoothstep(sz,0.,d)*sc*.65;
  }
  // eye calm zone
  float eye=length(uv-m);
  c*=1.-exp(-eye*4.);
  c+=exp(-eye*eye*12.)*vec3(0.,.2,.4)*.3;
  // lightning arcs
  for(int j=0;j<4;j++){
    float jd=float(j);
    float ph=mod(u_t*2.+jd*1.5,4.);
    if(ph<.25){
      float alpha=(.25-ph)/.25;
      float ax=hash(jd+u_t*.12)*2.-1., ay=hash(jd+u_t*.12+1.)*2.-1.;
      float bx=m.x, by=m.y;
      vec2 aa=vec2(ax,ay),bb=vec2(bx,by);
      vec2 pa=uv-aa,ba=bb-aa;
      float h2=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);
      float d2=length(pa-ba*h2);
      c+=smoothstep(.02,0.,d2)*vec3(.4,.95,1.)*alpha*.8;
    }
  }
  c=pow(c,vec3(.75));
  gl_FragColor=vec4(c,1.);
}`}

]; // end EFFECTS

// ── WebGL setup ───────────────────────────────────────────────────────────────
function mkGL(canvas, fragSrc) {
  const gl = canvas.getContext('webgl', {antialias:true, powerPreference:'high-performance'});
  if (!gl) return null;
  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fragSrc));
  gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const pos=gl.getAttribLocation(prog,'a_pos');
  gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);
  return{
    gl,
    uRes:gl.getUniformLocation(prog,'u_res'),
    uT:  gl.getUniformLocation(prog,'u_t'),
    uM:  gl.getUniformLocation(prog,'u_mouse')
  };
}

// ── Build DOM ─────────────────────────────────────────────────────────────────
const gridEl=document.getElementById('grid');
const ctxs=[];

EFFECTS.forEach((e,i)=>{
  const cell=document.createElement('div');
  cell.className='cell';

  const ring=document.createElement('div'); ring.className='hover-ring';
  const num=document.createElement('div'); num.className='num'; num.textContent=String(i+1).padStart(2,'0');
  const canvas=document.createElement('canvas'); canvas.width=256; canvas.height=256;
  const mtag=document.createElement('div'); mtag.className='mouse-tag'; mtag.textContent='⊕';
  const lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent=e.name+' · '+e.hint;

  cell.append(ring,num,mtag,canvas,lbl);
  gridEl.appendChild(cell);

  const ctx=mkGL(canvas,e.frag);
  if(!ctx) return;

  // per-canvas smooth mouse state
  let mx=0.5, my=0.5, tmx=0.5, tmy=0.5;

  // Mouse events on the CELL (larger hit area)
  cell.addEventListener('mousemove', ev=>{
    const r=canvas.getBoundingClientRect();
    tmx=(ev.clientX-r.left)/r.width;
    tmy=1.-(ev.clientY-r.top)/r.height;
    mtag.style.color='#00d4ff88';
  });
  cell.addEventListener('mouseleave',()=>{ mtag.style.color='#0d3a50'; });

  ctxs.push({canvas, ...ctx, get mx(){return mx;}, get my(){return my;},
    tick(){ mx+=(tmx-mx)*.12; my+=(tmy-my)*.12; }
  });
});

// ── Render loop ───────────────────────────────────────────────────────────────
const T0=performance.now();
function frame(){
  const t=(performance.now()-T0)/1000;
  ctxs.forEach(c=>{
    c.tick();
    const {gl,uRes,uT,uM,canvas,mx,my}=c;
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.uniform2f(uRes,canvas.width,canvas.height);
    gl.uniform1f(uT,t);
    gl.uniform2f(uM,mx,my);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
