<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMWATER — Ultimate Product Reveals</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
<!-- GSAP for 3D Scroll Scrubbing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>
  :root {
    --bg: #020810; --panel: #07182e;
    --cyan: #00d4ff; --cyan2: #00ff9d;
    --border: rgba(0, 212, 255, 0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: #fff;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }
  header {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 1.5rem 4%; display: flex; justify-content: space-between;
    z-index: 100; pointer-events: none;
    background: linear-gradient(to bottom, rgba(2,8,16,0.9), transparent);
  }
  .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; letter-spacing: 0.2em; }
  .logo span { color: var(--cyan); }
  
  .section-title {
    text-align: center; font-size: 3rem; font-weight: 800;
    margin-bottom: 2rem; letter-spacing: -0.02em;
  }
  .tag {
    font-family: 'Share Tech Mono', monospace; color: var(--cyan);
    font-size: 0.8rem; letter-spacing: 0.15em;
    border: 1px solid var(--cyan); padding: 4px 12px; border-radius: 20px;
    display: inline-block; margin-bottom: 1rem;
  }

  /* ─────────────────────────────────────────
     1. X-RAY SCANNER
  ───────────────────────────────────────── */
  .xray-section {
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-bottom: 1px solid var(--border);
  }
  .xray-container {
    position: relative; width: 800px; height: 500px;
    border-radius: 8px; overflow: hidden;
    cursor: crosshair;
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .xray-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  .xray-solid {
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"><rect width="800" height="500" fill="%2307182e"/><text x="400" y="250" fill="%2300d4ff" font-size="40" font-family="sans-serif" text-anchor="middle" font-weight="bold">OUTER SHELL (SOLID RENDER)</text></svg>') center/cover;
  }
  .xray-wireframe {
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"><rect width="800" height="500" fill="%23020810"/><path d="M0 50L800 50M0 100L800 100M0 150L800 150M0 200L800 200M0 250L800 250M0 300L800 300M0 350L800 350M0 400L800 400M0 450L800 450" stroke="%2300ff9d" stroke-width="1" opacity="0.3"/><path d="M50 0L50 500M100 0L100 500M150 0L150 500M200 0L200 500M250 0L250 500M300 0L300 500M350 0L350 500M400 0L400 500M450 0L450 500M500 0L500 500M550 0L550 500M600 0L600 500M650 0L650 500M700 0L700 500M750 0L750 500" stroke="%2300ff9d" stroke-width="1" opacity="0.3"/><circle cx="400" cy="250" r="150" stroke="%2300ff9d" stroke-width="4" fill="none"/><text x="400" y="250" fill="%2300ff9d" font-size="40" font-family="sans-serif" text-anchor="middle" font-weight="bold">INTERNAL P&ID WIREFRAME</text></svg>') center/cover;
    clip-path: circle(0px at 50% 50%);
  }

  /* ─────────────────────────────────────────
     2. LIQUID DISTORTION TRANSITION
  ───────────────────────────────────────── */
  .liquid-section {
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-bottom: 1px solid var(--border);
    background: #040c17;
  }
  .liquid-container {
    width: 800px; height: 500px; position: relative;
    border-radius: 8px; overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    cursor: pointer;
  }
  #liquid-canvas { width: 100%; height: 100%; display: block; }
  
  /* ─────────────────────────────────────────
     3. APPLE-STYLE 3D SCROLL SCRUBBING
  ───────────────────────────────────────── */
  .scroll-section {
    height: 300vh; /* Tạo độ dài để cuộn */
    position: relative;
    background: var(--bg);
  }
  .sticky-container {
    position: sticky; top: 0;
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
  }
  #scroll-canvas {
    width: 800px; height: 600px;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
  }
  .scroll-overlay {
    position: absolute; top: 20%; left: 10%;
    max-width: 400px;
  }
  .scroll-overlay h3 { font-size: 2.5rem; margin-bottom: 1rem; }
  .scroll-overlay p { font-size: 1.1rem; color: var(--cyan); font-family: 'Share Tech Mono'; }

</style>
</head>
<body>

<header>
  <div class="logo">OM<span>W</span>ATER</div>
  <div style="font-family: 'Share Tech Mono'; color: var(--cyan);">PRODUCT REVEALS</div>
</header>

<!-- 1. X-RAY SCANNER -->
<section class="xray-section">
  <div class="tag">01 / X-RAY SCANNER</div>
  <h2 class="section-title">Kính Lúp Xuyên Thấu</h2>
  <div class="xray-container" id="xray-box">
    <div class="xray-layer xray-solid"></div>
    <div class="xray-layer xray-wireframe" id="xray-mask"></div>
  </div>
</section>

<!-- 2. LIQUID DISTORTION -->
<section class="liquid-section">
  <div class="tag">02 / LIQUID DISTORTION</div>
  <h2 class="section-title">Hiệu Ứng Nước Cuộn (Hover)</h2>
  <div class="liquid-container" id="liquid-box">
    <canvas id="liquid-canvas"></canvas>
  </div>
</section>

<!-- 3. 3D SCROLL SCRUBBING -->
<section class="scroll-section" id="scroll-sec">
  <div class="sticky-container">
    <div class="scroll-overlay">
      <div class="tag">03 / APPLE-STYLE SCROLL</div>
      <h3 id="scroll-title">360° Inspection</h3>
      <p id="scroll-data">ANGLE: 0° / ISOMETRIC</p>
    </div>
    <canvas id="scroll-canvas" width="800" height="600"></canvas>
  </div>
</section>

<script>
gsap.registerPlugin(ScrollTrigger);

/* ─────────────────────────────────────────
   1. X-RAY SCANNER LOGIC
───────────────────────────────────────── */
const xrayBox = document.getElementById('xray-box');
const xrayMask = document.getElementById('xray-mask');

xrayBox.addEventListener('mousemove', (e) => {
  const rect = xrayBox.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  gsap.to(xrayMask, {
    clipPath: `circle(120px at ${x}px ${y}px)`,
    duration: 0.3,
    ease: "power2.out"
  });
});
xrayBox.addEventListener('mouseleave', () => {
  gsap.to(xrayMask, {
    clipPath: `circle(0px at 50% 50%)`,
    duration: 0.5,
    ease: "power2.out"
  });
});

/* ─────────────────────────────────────────
   2. LIQUID DISTORTION (WEBGL)
───────────────────────────────────────── */
function initLiquid() {
  const canvas = document.getElementById('liquid-canvas');
  const gl = canvas.getContext('webgl');
  if(!gl) return;
  canvas.width = 800; canvas.height = 500;
  gl.viewport(0,0,800,500);

  // Generate 2 placeholder textures (Solid and Liquid Version)
  function createTextureImage(color, text) {
    const c = document.createElement('canvas');
    c.width=800; c.height=500;
    const ctx = c.getContext('2d');
    ctx.fillStyle = color; ctx.fillRect(0,0,800,500);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 50px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(text, 400, 250);
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(100, 300, 600, 20); // fake bar
    return c;
  }
  const img1 = createTextureImage('#07182e', 'NORMAL STATE (SOLID)');
  const img2 = createTextureImage('#004d80', 'FILTERED STATE (PURIFIED)');

  function loadTexture(gl, image, unit) {
    const tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    return tex;
  }

  const tex1 = loadTexture(gl, img1, 0);
  const tex2 = loadTexture(gl, img2, 1);

  const vs = `attribute vec2 p; varying vec2 vUv; void main(){vUv=p*.5+.5; vUv.y=1.-vUv.y; gl_Position=vec4(p,0,1);}`;
  const fs = `
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D tex1; uniform sampler2D tex2;
    uniform float progress;
    // noise func
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
    float noise(vec2 p){
      vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
    }
    void main(){
      vec2 p = vUv;
      float n = noise(p*10.0)*0.1;
      // Distortion vector based on progress
      vec2 disp = vec2(n) * sin(progress*3.14) * 0.5;
      vec4 c1 = texture2D(tex1, p + disp);
      vec4 c2 = texture2D(tex2, p - disp);
      gl_FragColor = mix(c1, c2, progress);
    }
  `;

  function mkShader(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pLoc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(pLoc); gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

  gl.uniform1i(gl.getUniformLocation(prog, 'tex1'), 0);
  gl.uniform1i(gl.getUniformLocation(prog, 'tex2'), 1);
  const uProg = gl.getUniformLocation(prog, 'progress');

  let currentProg = 0;
  let targetProg = 0;

  document.getElementById('liquid-box').addEventListener('mouseenter', () => targetProg = 1);
  document.getElementById('liquid-box').addEventListener('mouseleave', () => targetProg = 0);

  function draw() {
    currentProg += (targetProg - currentProg) * 0.05;
    gl.uniform1f(uProg, currentProg);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(draw);
  }
  draw();
}
initLiquid();

/* ─────────────────────────────────────────
   3. APPLE-STYLE 3D SCROLL SCRUBBING
───────────────────────────────────────── */
// Fake a 3D rotating machine by drawing an Isometric Cylinder in Canvas 2D
function init3DScroll() {
  const canvas = document.getElementById('scroll-canvas');
  const ctx = canvas.getContext('2d');
  const cx = 400, cy = 300;

  // Obj holds the rotation progress (0 to 1)
  const animObj = { frame: 0 };

  function draw3DMachine(progress) {
    ctx.clearRect(0,0,800,600);
    
    // Draw base shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(cx, cy+150, 120, 40, 0, 0, Math.PI*2); ctx.fill();

    const angle = progress * Math.PI * 2; // 360 rotation
    
    // Cylinder Body
    const r = 100;
    const h = 200;
    
    ctx.save();
    ctx.translate(cx, cy);
    
    // Body gradient simulating lighting based on rotation
    let lx = Math.cos(angle)*50;
    const grad = ctx.createLinearGradient(-r, 0, r, 0);
    grad.addColorStop(0, '#0a2a48');
    grad.addColorStop(0.5, '#00d4ff'); // highlight
    grad.addColorStop(1, '#020810');
    
    ctx.fillStyle = grad;
    ctx.strokeStyle = '#00ff9d';
    ctx.lineWidth = 2;

    // Draw Cylinder Body
    ctx.beginPath();
    ctx.moveTo(-r, -h/2);
    ctx.lineTo(-r, h/2);
    ctx.arc(0, h/2, r, r*0.35, 0, Math.PI, false);
    ctx.lineTo(r, -h/2);
    ctx.arc(0, -h/2, r, r*0.35, Math.PI, 0, true);
    ctx.fill();
    ctx.stroke();

    // Draw Top Lid
    ctx.fillStyle = '#07182e';
    ctx.beginPath();
    ctx.ellipse(0, -h/2, r, r*0.35, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // Draw dynamic pipes/details rotating
    for(let i=0; i<3; i++) {
      let pAngle = angle + (i * Math.PI*2/3);
      let px = Math.cos(pAngle) * r;
      let pz = Math.sin(pAngle) * r * 0.35; // isometric depth
      
      // Only draw if facing front
      if(pz > 0) {
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(px - 10, -h/2 + pz - 20, 20, h*0.8);
        ctx.strokeRect(px - 10, -h/2 + pz - 20, 20, h*0.8);
      }
    }
    ctx.restore();
    
    // Update Text
    document.getElementById('scroll-data').innerText = `ROTATION: ${Math.round(progress*360)}° / ISOMETRIC Y`;
  }

  // Initial draw
  draw3DMachine(0);

  // Bind to ScrollTrigger
  ScrollTrigger.create({
    trigger: "#scroll-sec",
    start: "top top",
    end: "bottom bottom",
    scrub: 1, // Smooth scrubbing
    onUpdate: (self) => {
      draw3DMachine(self.progress);
    }
  });
}
init3DScroll();

</script>
</body>
</html>
